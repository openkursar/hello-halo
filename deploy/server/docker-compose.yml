services:
  halo-server:
    build: .
    image: halo-server:latest
    container_name: halo-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      HALO_DATA_DIR: /data
      HALO_REMOTE_PASSWORD: change-me-to-a-long-random-token
      HALO_AI_PROVIDER: openai
      HALO_AI_API_URL: https://your-model-gateway.example.com/v1
      HALO_AI_API_KEY: your-api-key
      HALO_AI_MODEL: your-model-id
    mem_limit: 8g
