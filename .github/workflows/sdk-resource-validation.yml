name: SDK resource validation

on:
  pull_request:
    paths:
      - src/sdk/halo-sdk/**
      - .github/workflows/sdk-resource-validation.yml
  workflow_dispatch:
    inputs:
      live:
        description: Run live-model soak and compaction validation
        type: boolean
        default: false
      provider:
        description: Provider matching the SDK_TEST_API_KEY secret
        type: choice
        default: glm
        options: [glm, deepseek]

permissions:
  contents: read

jobs:
  deterministic:
    name: Resource regression (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/sdk/halo-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/sdk/halo-sdk/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install pinned ripgrep
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz; sum=253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7 ;;
            macOS-ARM64) asset=ripgrep-15.0.0-aarch64-apple-darwin.tar.gz; sum=98bb2e61e7277ba0ea72d2ae2592497fd8d2940934a16b122448d302a6637e3b ;;
            *) echo "No pinned ripgrep for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset" "https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/$asset"
          if command -v sha256sum >/dev/null; then echo "$sum  $asset" | sha256sum -c -; else echo "$sum  $asset" | shasum -a 256 -c -; fi
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/${asset%.tar.gz}" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm ci --prefix swe-bench-eval --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck --prefix swe-bench-eval
      - run: npm test
      - run: npm run test:resource-harness
        env:
          SDK_BEHAVIOR_TEST_ROOT: ${{ github.workspace }}/src/sdk/halo-sdk/dist
      - run: npm run test:resources
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resource-results-${{ matrix.os }}-${{ matrix.node }}
          path: src/sdk/halo-sdk/validation/results/
          retention-days: 14

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src/sdk/halo-sdk
    concurrency:
      group: sdk-live-resource-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/sdk/halo-sdk/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - run: npm ci
      - name: Live soak and compaction
        shell: bash
        run: |
          case "$SDK_TEST_PROVIDER" in
            glm) validation_args=(--provider-type openai-compat --base-url https://open.bigmodel.cn/api/coding/paas/v4 --model glm-5.3-flash --thinking adaptive --effort low --max-output-tokens 8192) ;;
            deepseek) validation_args=() ;;
            *) echo 'Unsupported validation provider' >&2; exit 1 ;;
          esac
          npm run test:resources:soak -- "${validation_args[@]}"
          npm run test:resources:live -- "${validation_args[@]}" --rounds 6 --context-window 8000 --require-compaction
        env:
          SDK_TEST_API_KEY: ${{ secrets.SDK_TEST_API_KEY }}
          SDK_TEST_PROVIDER: ${{ inputs.provider }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-resource-results
          path: src/sdk/halo-sdk/validation/results/
          retention-days: 30
