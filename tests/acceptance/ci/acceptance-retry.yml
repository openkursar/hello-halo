name: Halo acceptance retry

# A run whose runner lost its connection to GitHub says nothing about the product.
# This starts such a run again, at most twice, and leaves every other failure alone.

on:
  workflow_run:
    workflows: [Halo acceptance]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Start the run again after a lost connection
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide from the job record
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: run.id, filter: 'latest', per_page: 100 });
            // Job setup failed, or a step never finished because the runner disappeared mid-step.
            const lost = data.jobs.some(job => job.name === 'acceptance' && job.conclusion === 'failure'
              && (job.steps?.[0]?.conclusion === 'failure' || job.steps?.some(step => step.conclusion === null)));
            if (!lost) {
              core.info('The failure came from the work itself, so the run is not started again.');
              return;
            }
            await github.rest.actions.reRunWorkflowFailedJobs({ ...context.repo, run_id: run.id });
            core.info(`Attempt ${run.run_attempt} lost its runner; the run was started again.`);
