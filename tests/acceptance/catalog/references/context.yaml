version: 1
id: references.context
module: references
title:
  en: Discuss a precise piece of work
  zh: 讨论明确的一段内容
story:
  en: I can select the exact passage or change I mean and let the AI see that context.
  zh: 我能选中要讨论的具体段落或修改，让 AI 理解上下文。
basis: observed
references:
  - tests/e2e/specs/references.spec.ts
  - tests/e2e/specs/acceptance-reference-context.spec.ts
  - tests/e2e/specs/acceptance-reference-diff.spec.ts
  - tests/e2e/specs/acceptance-reference-message.spec.ts
  - tests/e2e/specs/acceptance-reference-terminal.spec.ts
  - src/renderer/components/references/ReferenceChips.tsx
  - src/main/services/agent/references.ts
promises:
  source:
    en: A reference retains the selected source and location.
    zh: 引用保留选定来源及位置。
  control:
    en: References can be inspected, removed and restored through the offered undo.
    zh: 引用可检查、移除，并通过提供的撤销恢复。
  send:
    en: Submitted references reach the model as the intended context once.
    zh: 发送的引用只作为预期上下文传给模型一次。
scenarios:
  - id: references.context.manage
    title:
      en: Create, inspect and remove reference cards
      zh: 创建、检查和移除引用卡片
    verifies:
      - source
      - control
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Open a diff and a readable source file.
        zh: 打开差异及可读源文件。
    steps:
      - en: Create a comment and selection reference, inspect the list, remove a group and undo.
        zh: 创建评论及选区引用，检查列表，移除分组后撤销。
    expected:
      - en: Cards identify the right sources and removal/undo changes only the selected references.
        zh: 卡片指向正确来源，移除与撤销仅影响选定引用。
  - id: references.context.send
    title:
      en: Send selected context
      zh: 发送选中上下文
    verifies:
      - send
      - source
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    variants:
      source:
        - file
        - diff
        - message
    requirements:
      - halo-sdk
    notes:
      en: Each source variant pairs its passage with a selection from a different file. The file variant includes a commented selection; the diff variant includes both sides. Counts and absence of unrelated text are checked in the submitted reference block alongside the saved message records. A fixed model reply alone proves nothing about received context. Terminal output has a separate scenario because its supported platforms differ.
      zh: 每种来源的片段均搭配另一文件的选区。文件变体包含带评论的选区，差异变体包含两侧内容。引用块中的次数、无关内容缺失及消息保存记录会一起验证，不能仅凭脚本模型固定回复认定已收到上下文。终端输出因支持平台不同而单独列为场景。
    preconditions:
      - en: A message draft includes two distinct source references.
        zh: 消息草稿含两个不同来源引用。
    steps:
      - en: Send through the UI to a scripted model and inspect the request.
        zh: 通过界面发送到脚本模型并检查请求。
    expected:
      - en: All selected excerpts and locations reach the model without unrelated content or duplication.
        zh: 所选片段及位置均传给模型，不夹带无关内容或重复。
  - id: references.context.send-terminal
    title:
      en: Send selected terminal output with a file passage
      zh: 同时发送终端输出选区与文件片段
    verifies:
      - send
      - source
    platforms:
      - darwin
      - win32
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A real terminal session has produced selectable output and a separate source file is readable.
        zh: 真实终端会话已产生可选输出，另一个源文件可读。
    steps:
      - en: Select output with the pointer, add it and a file selection to the conversation, then send.
        zh: 用鼠标选择终端输出，将它与文件选区加入对话后发送。
    expected:
      - en: The model receives each selected excerpt once with the correct terminal or file identity; saved references retain those identities after restart.
        zh: 模型收到各选区一次并携带正确终端或文件身份，保存的引用在重启后仍保留这些身份。
    notes:
      en: This requires the real application PTY on its supported desktop platforms. Linux has no application PTY implementation and is not covered by a passing skip. No fixture replaces terminal output or inserts a selection directly into application state.
      zh: 此场景要求在支持的桌面平台使用应用真实 PTY；Linux 没有对应实现，不能用跳过算通过。测试不替换终端输出，也不向应用状态直接注入选区。
