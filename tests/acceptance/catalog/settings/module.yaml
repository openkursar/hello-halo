version: 1
id: settings
title:
  en: Personal preferences and system settings
  zh: 个人偏好与系统设置
description:
  en: Change appearance, input behavior, proxy and diagnostics settings deliberately.
  zh: 明确修改外观、输入行为、代理及诊断设置。
paths:
  - src/renderer/components/settings/**
  - src/renderer/pages/SettingsPage.tsx
  - src/renderer/components/org-sign-in/**
  - src/renderer/stores/org-sign-in.store.ts
  - src/main/services/enterprise-identity/**
  - src/main/services/login-window.ts
  - src/main/ipc/enterprise-identity.ts
  - src/shared/**/*enterprise-identity*
  - tests/fixtures/enterprise-identity-mock/**
  - tests/e2e/specs/org-sign-in.spec.ts
  - src/main/foundation/config.service.ts
  - src/main/foundation/config-encryption.ts
  - src/main/foundation/credential-safety.ts
  - src/main/services/proxy-fetch.ts
dependsOn:
  - startup
scope:
  en: Desktop and remote settings with explicit desktop-only groups; theme/language/scale/send key, proxy, credential faults, shared browser cleanup and desktop organization sign-in.
  zh: 桌面与远程设置及明确的桌面专用分组；主题、语言、缩放、发送键、代理、凭证问题、共享浏览数据清理和桌面组织登录。
