version: 1
id: settings.safety
module: settings
title:
  en: Recover settings and clear browser data deliberately
  zh: 恢复设置并明确清理浏览数据
story:
  en: I can resolve configuration problems without silently overwriting unreadable data or deleting unrelated work.
  zh: 我能处理配置问题，不悄悄覆盖无法读取的数据或删除无关工作。
basis: observed
references:
  - src/renderer/components/settings/ConfigUnreadableBanner.tsx
  - src/renderer/components/settings/CredentialAlertBanner.tsx
  - src/renderer/components/settings/SystemSection.tsx
  - tests/e2e/specs/acceptance-settings.spec.ts
  - tests/e2e/specs/acceptance-config-recovery.spec.ts
promises:
  unreadable:
    en: Unreadable configuration is reported and protected from an ordinary stale save.
    zh: 配置不可读会提示，并避免普通旧状态保存覆盖。
  clear:
    en: Shared browser cleanup explains sign-outs and preserves Halo data and unrelated sessions.
    zh: 共享浏览数据清理说明会退出登录，并保留 Halo 数据及无关会话。
scenarios:
  - id: settings.safety.unreadable
    title:
      en: Handle a damaged configuration file
      zh: 处理损坏配置文件
    verifies:
      - unreadable
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated application has saved preferences and an existing AI source. After its process exits, only its configuration JSON is deliberately damaged.
        zh: 隔离应用已有保存的偏好和 AI 来源；确认进程退出后，仅故意损坏其配置 JSON。
    steps:
      - en: Reopen Halo, inspect the unreadable-file warning and attempt the theme save offered on the first-launch preferences screen.
        zh: 重开 Halo，查看文件不可读警告，并在实际显示的首次偏好设置页尝试保存主题。
      - en: Restore the valid configuration bytes, select Check again, then leave setup through Skip for now and save a different theme in Settings.
        zh: 恢复原合法配置字节，点击再次检查，再通过暂时跳过离开设置引导，并在设置页保存不同主题。
      - en: Restart and inspect the saved theme, original AI source and an unrelated file.
        zh: 重启后检查保存的主题、原 AI 来源和无关文件。
    expected:
      - en: Halo identifies the unreadable file and reports Not saved; the failed save preserves the damaged bytes exactly.
        zh: Halo 明确指出不可读文件并提示未保存；失败保存逐字节保留损坏内容。
      - en: Check again reloads the repaired preferences without replacing them with fallback defaults. A later normal save persists across restart while the original AI source and unrelated file remain.
        zh: 再次检查重新载入修复后的偏好，不用回退默认值替换；之后的正常保存跨重启保留，原 AI 来源和无关文件仍在。
    notes:
      en: Unreadable configuration currently enters first-launch setup, where the normal Settings navigation is unavailable. This case exercises that real save and recovery route, not a forced Settings route. An offered Windows Git Bash setup is explicitly skipped through its UI without downloading. No model request is made; the shared fixture requires the Halo SDK for its initial engine check.
      zh: 当前配置不可读时进入首次设置引导，普通设置导航不可用。本例验证该真实保存和恢复路径，不强制跳入设置页；若 Windows 提供 Git Bash 安装引导，通过界面明确跳过，不下载。全程不发送模型请求，共享夹具初始引擎检查需要 Halo SDK。
  - id: settings.safety.clear-browser
    title:
      en: Cancel and confirm shared-browser cleanup
      zh: 取消后确认共享浏览数据清理
    verifies:
      - clear
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: The isolated application has a persisted shared-browser login cookie, a cookie in a different browser partition, and unrelated saved Halo history and files.
        zh: 隔离应用中已有共享浏览器登录 Cookie、另一浏览分区中的 Cookie，以及无关的 Halo 历史和文件。
    steps:
      - en: Open cleanup confirmation, cancel, then confirm it.
        zh: 打开清理确认，先取消再确认。
    expected:
      - en: Cancellation preserves the cookie; confirmation clears shared site data while unrelated Halo records remain.
        zh: 取消保留 Cookie，确认清理共享网站数据，无关 Halo 记录保留。
    notes:
      en: Preconditions use real Electron session storage. The cleanup is initiated through the product UI; this verifies storage isolation, not an external provider’s login protocol.
      zh: 前置数据写入真实 Electron 会话存储；清理由产品界面发起，验证的是存储隔离，不是外部供应商登录协议。
