version: 1
id: automation.runs
module: automation
title:
  en: Observe and continue a run
  zh: 查看并继续执行
story:
  en: I can start work, see its progress, add instructions and continue after it finishes.
  zh: 我能启动任务、看进度、补充说明，并在结束后继续。
basis: documented
references:
  - src/main/apps/runtime/DESIGN.md
  - tests/e2e/specs/digital-human-lifecycle.spec.ts
  - src/renderer/components/apps/SessionDetailView.tsx
  - tests/e2e/specs/acceptance-automation.spec.ts
promises:
  progress:
    en: A manual run exposes its actual current process and persisted result.
    zh: 手动任务展示实际执行过程和保存结果。
  followup:
    en: A follow-up belongs to the finished run’s conversation and is a new turn.
    zh: 追问属于已完成任务的对话，作为新一轮执行。
  live-input:
    en: A message sent during an active execution reaches its next processing step and remains in that run's history.
    zh: 执行中发送的补充消息到达下一处理步骤，并保留在该任务历史中。
  recovery:
    en: A failed or stopped run remains distinguishable from successful completion.
    zh: 失败或停止的任务与成功完成可以区分。
scenarios:
  - id: automation.runs.start
    title:
      en: Run a digital human once
      zh: 手动执行一次数字人
    verifies:
      - progress
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A runnable person is installed with a scripted model.
        zh: 已安装可运行的数字人并使用脚本模型。
    steps:
      - en: Click Run now, open the live process and wait for a report.
        zh: 点击立即运行，查看实时过程并等待报告。
    expected:
      - en: The actual report succeeds, activity is persisted and the run leaves its active state.
        zh: 报告真实成功，活动已保存，任务退出运行状态。
  - id: automation.runs.followup
    title:
      en: Continue after a completed run
      zh: 任务完成后继续追问
    verifies:
      - followup
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A completed run has a known first reply.
        zh: 已完成任务有已知首轮回复。
    steps:
      - en: Send a follow-up and reopen its history.
        zh: 发追问并重新打开记录。
    expected:
      - en: A distinct second answer follows the original content without replacing it.
        zh: 不同的第二轮回答追加在原记录后，不覆盖第一轮。
  - id: automation.runs.failure
    title:
      en: Stop or fail a run and inspect it later
      zh: 停止或失败后回看任务
    verifies:
      - recovery
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    variants:
      outcome:
        - stopped
        - failed
    preconditions:
      - en: Use isolated application data and a local model endpoint. The stopped variant waits in a real tool; the failed variant receives a permanent rejection from the model endpoint.
        zh: 使用隔离应用数据及本地模型端点。停止变体等待真实工具执行；失败变体由模型端点返回不可重试的拒绝。
    steps:
      - en: Stop the active execution through the UI, or let the model request fail, and inspect its activity.
        zh: 通过界面停止活动执行，或让模型请求真实失败，然后查看活动。
      - en: Restore the model endpoint, start a separate execution through Run now, and reopen both records after an application restart.
        zh: 恢复模型端点，通过立即运行启动独立执行，并在应用重启后重新查看两条记录。
    expected:
      - en: The retained record explains the actual outcome and offers only supported continuation.
        zh: 保存记录说明真实结果，仅提供受支持的继续方式。
      - en: A later successful run has a distinct identity and does not replace the earlier stopped or failed record.
        zh: 后续成功执行具有独立身份，不覆盖之前停止或失败的记录。
    notes:
      en: Stopping and provider failure are separate required variants. A recoverable tool error alone does not establish failed-run recovery.
      zh: 主动停止与供应商失败是两个独立必测变体。单个可恢复工具错误不构成任务失败恢复证据。
  - id: automation.runs.live-input
    title:
      en: Add an instruction while a tool is running
      zh: 工具执行时补充说明
    verifies:
      - live-input
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated digital human is running a real local tool held by a test-owned file gate.
        zh: 隔离数字人正在执行真实本地工具，由测试自有文件控制其结束。
    steps:
      - en: Open the live process, send a correction through its composer, then release the tool.
        zh: 打开实时过程，通过输入框发送修正，再释放工具。
      - en: Observe the next model request and completed report, then restart and reopen the process.
        zh: 检查下一模型请求及完成报告，然后重启并重新打开过程。
    expected:
      - en: The correction reaches the next model step of the same run, is saved once in its transcript and remains readable after restart.
        zh: 修正到达同一任务的下一模型步骤，在记录中仅保存一次，并在重启后仍可阅读。
