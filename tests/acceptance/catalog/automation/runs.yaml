version: 1
id: automation.runs
module: automation
title:
  en: Observe and continue a run
  zh: 查看并继续执行
story:
  en: I can start work, see its progress, add instructions and continue after it finishes.
  zh: 我能启动任务、看进度、补充说明，并在结束后继续。
basis: documented
references:
  - src/main/apps/runtime/DESIGN.md
  - tests/e2e/specs/digital-human-lifecycle.spec.ts
  - src/renderer/components/apps/SessionDetailView.tsx
promises:
  progress:
    en: A manual run exposes its actual current process and persisted result.
    zh: 手动任务展示实际执行过程和保存结果。
  followup:
    en: A follow-up belongs to the finished run’s conversation and is a new turn.
    zh: 追问属于已完成任务的对话，作为新一轮执行。
  recovery:
    en: A failed or stopped run remains distinguishable from successful completion.
    zh: 失败或停止的任务与成功完成可以区分。
scenarios:
  - id: automation.runs.start
    title:
      en: Run a digital human once
      zh: 手动执行一次数字人
    verifies:
      - progress
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A runnable person is installed with a scripted model.
        zh: 已安装可运行的数字人并使用脚本模型。
    steps:
      - en: Click Run now, open the live process and wait for a report.
        zh: 点击立即运行，查看实时过程并等待报告。
    expected:
      - en: The actual report succeeds, activity is persisted and the run leaves its active state.
        zh: 报告真实成功，活动已保存，任务退出运行状态。
  - id: automation.runs.followup
    title:
      en: Continue after a completed run
      zh: 任务完成后继续追问
    verifies:
      - followup
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A completed run has a known first reply.
        zh: 已完成任务有已知首轮回复。
    steps:
      - en: Send a follow-up and reopen its history.
        zh: 发追问并重新打开记录。
    expected:
      - en: A distinct second answer follows the original content without replacing it.
        zh: 不同的第二轮回答追加在原记录后，不覆盖第一轮。
  - id: automation.runs.failure
    title:
      en: Stop or fail a run and inspect it later
      zh: 停止或失败后回看任务
    verifies:
      - recovery
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A test run is executing a controlled tool.
        zh: 测试任务正在执行可控工具。
    steps:
      - en: Stop it or inject a deterministic tool failure, then reopen activity.
        zh: 停止它或触发确定性工具错误，再查看活动。
    expected:
      - en: The retained record explains the actual outcome and offers only supported continuation.
        zh: 保存记录说明真实结果，仅提供受支持的继续方式。
