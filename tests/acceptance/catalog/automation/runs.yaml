version: 1
id: automation.runs
module: automation
title:
  en: Observe and continue a run
  zh: 查看并继续执行
story:
  en: I can start work, see its progress, add instructions and continue after it finishes.
  zh: 我能启动任务、看进度、补充说明，并在结束后继续。
basis: documented
references:
  - src/main/apps/runtime/DESIGN.md
  - tests/e2e/specs/digital-human-lifecycle.spec.ts
  - src/renderer/components/apps/SessionDetailView.tsx
  - tests/e2e/specs/acceptance-automation.spec.ts
  - tests/e2e/specs/acceptance-run-collaboration.spec.ts
promises:
  progress:
    en: A manual run exposes its actual current process and persisted result.
    zh: 手动任务展示实际执行过程和保存结果。
  followup:
    en: A follow-up belongs to the finished run’s conversation and is a new turn.
    zh: 追问属于已完成任务的对话，作为新一轮执行。
  live-input:
    en: A message sent during an active execution reaches its next processing step and remains in that run's history.
    zh: 执行中发送的补充消息到达下一处理步骤，并保留在该任务历史中。
  recovery:
    en: A failed or stopped run remains distinguishable from successful completion.
    zh: 失败或停止的任务与成功完成可以区分。
  collaboration:
    en: Independent runs can delegate workspace checks and finish only after their collaborators have returned evidence and the digital human has reported the result. Explicit delegation restrictions and stopping remain effective.
    zh: 独立执行可以委派工作区检查，仅在协作者回报证据且数字人汇报结果后完成；明确的委派限制与停止操作仍有效。
scenarios:
  - id: automation.runs.collaboration
    title:
      en: Complete delegated checks from each independent trigger
      zh: 从各独立触发入口完成委派检查
    verifies: [collaboration, progress]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      trigger: [manual, schedule, webhook]
    preconditions:
      - en: An isolated application uses the real Halo engine and a local scripted provider. Three disposable files contain distinct random values.
        zh: 隔离应用使用真实 Halo 引擎与本地脚本供应商，三个临时文件包含不同随机值。
    steps:
      - en: Start through Run now, a real schedule boundary or an HTTP webhook. Create three collaborators, each reading one actual file and reporting to the lead; delay one with a test-owned local tool gate until the lead yields.
        zh: 通过立即运行、真实计划到期或 HTTP webhook 启动。创建三个协作者，各读取真实文件并向负责人回报；通过测试自有本地工具门控延迟一位，直到负责人让出执行。
      - en: Release the last collaborator and inspect the combined report. In the manual variant continue through the run composer without starting another run.
        zh: 释放最后一位协作者，检查汇总报告。手动变体通过任务输入框继续，不启动另一项任务。
    expected:
      - en: The run remains active while the delayed collaborator works, every assigned read and report succeeds, the input files stay unchanged and one final combined report completes the run.
        zh: 延迟协作者工作期间任务保持活动，各项读取与回报成功，输入文件不变，一份最终汇总报告结束任务。
      - en: The manual follow-up receives the original results and appends to the same run history.
        zh: 手动追问收到原始结果，追加在同一任务历史中。
    notes:
      en: Scripted provider responses verify real application orchestration and file tools, not live-model delegation quality. Only the manual variant verifies follow-up.
      zh: 脚本供应商验证真实应用编排与文件工具，不证明真实模型委派质量。仅手动变体验证追问。
  - id: automation.runs.collaboration-stop
    title:
      en: Stop an execution with a delayed collaborator
      zh: 停止包含延迟协作者的执行
    verifies: [collaboration, recovery]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    steps:
      - en: Stop through the real UI while a collaborator waits in a local tool, release the tool and restart the application.
        zh: 协作者等待本地工具时通过真实界面停止，释放工具并重启应用。
    expected:
      - en: The stopped run remains an error with a stop explanation and has no successful completion report after reopening.
        zh: 重开后停止任务保持错误状态并说明停止原因，没有成功完成报告。
  - id: automation.runs.collaboration-disabled
    title:
      en: Honor explicit delegation restrictions during independent execution
      zh: 独立执行遵守明确的委派限制
    verifies: [collaboration]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - en: The owner explicitly disables Task and spawn_agent in the global agent configuration.
        zh: 主人在全局智能体配置中明确禁用 Task 与 spawn_agent。
    steps:
      - en: Start an independent run and inspect actual provider tool advertisements and its collaboration association.
        zh: 启动独立任务，检查实际供应商工具目录与协作关联。
    expected:
      - en: No delegation tool is advertised, no collaboration is created and an ordinary report can still complete the run.
        zh: 工具目录没有委派工具，不创建协作，普通报告仍可结束任务。
  - id: automation.runs.start
    title:
      en: Run a digital human once
      zh: 手动执行一次数字人
    verifies:
      - progress
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A runnable person is installed with a scripted model.
        zh: 已安装可运行的数字人并使用脚本模型。
    steps:
      - en: Click Run now, open the live process and wait for a report.
        zh: 点击立即运行，查看实时过程并等待报告。
    expected:
      - en: The actual report succeeds, activity is persisted and the run leaves its active state.
        zh: 报告真实成功，活动已保存，任务退出运行状态。
  - id: automation.runs.followup
    title:
      en: Continue after a completed run
      zh: 任务完成后继续追问
    verifies:
      - followup
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A completed run has a known first reply.
        zh: 已完成任务有已知首轮回复。
    steps:
      - en: Send a follow-up and reopen its history.
        zh: 发追问并重新打开记录。
    expected:
      - en: A distinct second answer follows the original content without replacing it.
        zh: 不同的第二轮回答追加在原记录后，不覆盖第一轮。
  - id: automation.runs.failure
    title:
      en: Stop or fail a run and inspect it later
      zh: 停止或失败后回看任务
    verifies:
      - recovery
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    variants:
      outcome:
        - stopped
        - failed
    preconditions:
      - en: Use isolated application data and a local model endpoint. The stopped variant waits in a real tool; the failed variant receives a permanent rejection from the model endpoint.
        zh: 使用隔离应用数据及本地模型端点。停止变体等待真实工具执行；失败变体由模型端点返回不可重试的拒绝。
    steps:
      - en: Stop the active execution through the UI, or let the model request fail, and inspect its activity.
        zh: 通过界面停止活动执行，或让模型请求真实失败，然后查看活动。
      - en: Restore the model endpoint, start a separate execution through Run now, and reopen both records after an application restart.
        zh: 恢复模型端点，通过立即运行启动独立执行，并在应用重启后重新查看两条记录。
    expected:
      - en: The retained record explains the actual outcome and offers only supported continuation.
        zh: 保存记录说明真实结果，仅提供受支持的继续方式。
      - en: A later successful run has a distinct identity and does not replace the earlier stopped or failed record.
        zh: 后续成功执行具有独立身份，不覆盖之前停止或失败的记录。
    notes:
      en: Stopping and provider failure are separate required variants. A recoverable tool error alone does not establish failed-run recovery.
      zh: 主动停止与供应商失败是两个独立必测变体。单个可恢复工具错误不构成任务失败恢复证据。
  - id: automation.runs.live-input
    title:
      en: Add an instruction while a tool is running
      zh: 工具执行时补充说明
    verifies:
      - live-input
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated digital human is running a real local tool held by a test-owned file gate.
        zh: 隔离数字人正在执行真实本地工具，由测试自有文件控制其结束。
    steps:
      - en: Open the live process, send a correction through its composer, then release the tool.
        zh: 打开实时过程，通过输入框发送修正，再释放工具。
      - en: Observe the next model request and completed report, then restart and reopen the process.
        zh: 检查下一模型请求及完成报告，然后重启并重新打开过程。
    expected:
      - en: The correction reaches the next model step of the same run, is saved once in its transcript and remains readable after restart.
        zh: 修正到达同一任务的下一模型步骤，在记录中仅保存一次，并在重启后仍可阅读。
