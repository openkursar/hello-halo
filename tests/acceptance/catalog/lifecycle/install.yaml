version: 1
id: lifecycle.install
module: lifecycle
title:
  en: Start an installed release with existing work
  zh: 安装发布版并打开已有工作
story:
  en: I can install Halo and reopen my existing conversations and people after an upgrade.
  zh: 我能安装 Halo，并在升级后重新找到原来的对话和数字人。
basis: documented
references:
  - src/main/platform/store/DESIGN.md
  - tests/decentralized/checklist-upgrade-migration.mjs
  - tests/check/binaries.mjs
  - src/main/apps/runtime/migrations.ts
  - src/main/apps/manager/migrations.ts
  - src/main/apps/team/migrations.ts
  - src/main/services/conversation.service.ts
  - src/main/services/space.service.ts
  - src/main/foundation/config.service.ts
  - tests/e2e/specs/acceptance-profile-migration.spec.ts
  - tests/e2e/fixtures/data/app-runtime-v3.sql
promises:
  package:
    en: The packaged app starts using its shipped dependencies, not the source checkout.
    zh: 打包应用使用随包依赖启动，而非依赖源码目录。
  migration:
    en: Supported older data migrates with readable history and consistent activity.
    zh: 支持的旧数据迁移后历史可读、活动一致。
  failure:
    en: A failed upgrade or migration does not silently present missing records as an empty successful installation.
    zh: 升级或迁移失败不把缺失记录悄悄展示为空白成功安装。
scenarios:
  - id: lifecycle.install.packaged
    title:
      en: Launch a release package from a clean test location
      zh: 从干净测试位置启动发布包
    verifies:
      - package
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A built release package is available in a disposable installation location.
        zh: 可丢弃安装位置中已有发布包。
    steps:
      - en: Launch outside the source tree, open settings and perform a scripted chat tool action.
        zh: 在源码树之外启动，打开设置并执行脚本模型工具任务。
    expected:
      - en: The packaged runtime is identified and its shipped tools work.
        zh: 确认运行的是安装包，其附带工具可用。
    requirements:
      - packaged-app
  - id: lifecycle.install.migrate
    title:
      en: Upgrade a supported older profile
      zh: 升级支持的旧资料
    verifies:
      - migration
    variants:
      dataset:
        - app-runtime-v3
        - app-manager-v2
        - team-v19
        - conversation-v1
        - space-index-v1
        - space-index-v2
        - ai-sources-v1
    platforms: *a1
    profiles:
      - regression
    evidence: integration
    mode: scripted
    automation: planned
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated profile contains the selected documented historical data format, with known record identities and readable control data.
        zh: 隔离资料包含所选文档支持的历史格式，并有已知记录身份及可读对照资料。
    steps:
      - en: Open the profile with the current real application, inspect retained records and its pre-migration snapshot, and execute a new task that persists real activity.
        zh: 用当前真实应用打开资料，检查保留记录与迁移前快照，再执行保存真实活动的新任务。
      - en: Restart again and verify that completed migrations do not repeat or change the retained records.
        zh: 再次重启，验证已完成迁移不会重复或改变保留记录。
    expected:
      - en: Valid older identities, history and activity survive; the new task records its actual result without database-constraint failures, and the pre-migration snapshot remains readable.
        zh: 有效旧身份、历史及活动得以保留，新任务实际结果保存成功且无数据库约束错误，迁移前快照仍可读取。
    notes:
      en: Only app-runtime-v3 has a binding. It preserves the real appInstall manager state and all other current namespaces, reconstructs independently frozen runtime v3 SQL in a closed owned profile, then lets the current build run every later runtime migration. The reviewed target is explicitly v8; a version or layout change requires fixture review instead of deriving old input from current migration functions. Valid people, run/activity and space-history records are checked; a known deleted-app orphan is deliberately removed by the documented v4 rule. A real manual automation run uses the local scripted model and report_to_user to create new activity; its run, report identity and transcript must survive another restart. Ordinary person chat is not treated as a reporting entry point. This is a schema-boundary integration, not a historical release binary or UI migration test. Other listed old-format datasets remain required and unbound; no coverage of their migrations or old SDK-session formats is inferred.
      zh: 仅 app-runtime-v3 已绑定。它保留真实 appInstall 的管理器状态及其他当前命名空间，在已关闭的自有资料中按独立冻结 SQL 重建 runtime v3 结构，再由当前构建执行后续全部 runtime 迁移。已复核目标明确为 v8，版本或布局变化必须重审 fixture，不从当前迁移函数推导旧输入。检查有效数字人、运行/活动及空间历史记录；已删除数字人的已知孤儿记录按 v4 约定移除。真实手动自动任务通过本地脚本模型调用 report_to_user 产生新活动，运行、报表身份及过程记录必须在再次重启后保留。不把普通数字人聊天视为报表入口。本例是结构边界集成，不是历史发布二进制或迁移界面测试。其余旧格式仍为必需且未绑定，不推断已覆盖其迁移或旧 SDK 会话格式。
  - id: lifecycle.install.migration-failure
    title:
      en: Report a controlled migration failure
      zh: 报告受控迁移失败
    verifies:
      - failure
    variants:
      fault:
        - runtime-version-write
        - schema-ahead
    platforms: *a1
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: planned
    requirements:
      - halo-sdk
    preconditions:
      - en: A disposable copy of known data cannot complete the selected migration or schema check.
        zh: 已知资料的可丢弃副本无法完成所选迁移或结构检查。
    steps:
      - en: Start the real build, inspect its failure signal and actual retained database and history, then verify the documented recovery path using owned files only.
        zh: 启动真实构建，检查失败信号及实际保留的数据库与历史，再仅使用自有文件验证约定的恢复路径。
    expected:
      - en: The failure is explicit rather than an empty successful runtime; the original recoverable data and valid pre-migration snapshot are retained where that path produces one.
        zh: 失败明确且不是空白成功运行；原有可恢复数据及该路径产生的有效迁移前快照得以保留。
    notes:
      en: "Only runtime-version-write has a binding: a test-owned SQLite trigger rejects the final runtime schema-version update, after real migration SQL has executed. The test requires full namespace rollback, explicit runtime API failures, an actual product-created snapshot, restoration from that snapshot after removing only the controlled trigger, and idempotent reopening. No migration function or application handler is replaced. The native schema-ahead dialog and process refusal remain a separate unbound obligation; SQLite corruption recovery and every possible failure cause are not inferred. Backend diagnostics are not evidence of a visible recovery dialog."
      zh: 仅 runtime-version-write 已绑定：测试自有 SQLite 触发器在真实迁移 SQL 执行后拒绝最终版本更新。必须验证整个命名空间回滚、运行时 API 明确失败、产品实际生成的快照、仅移除受控触发器后从快照恢复及再次打开的幂等性。不替换迁移函数或应用处理器。原生结构超前提示及进程拒绝仍单列未绑定；不推断 SQLite 损坏恢复或所有失败原因均已验证。后端诊断不代表已有可见恢复对话框。
