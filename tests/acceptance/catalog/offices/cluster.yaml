version: 1
id: offices.cluster
module: offices
title:
  en: Keep a shared office consistent across devices
  zh: 让共享办公室在设备间保持一致
story:
  en: When my teammates work on other devices, our office membership, tasks and conversations remain
    coherent.
  zh: 当队友在其他设备上工作时，我们的办公室成员、任务和对话仍然一致。
basis: documented
references:
  - tests/decentralized/README.md
  - tests/decentralized/SCENARIOS.md
  - tests/decentralized/run-scenarios.mjs
promises:
  identity:
    en: Each device keeps an independent identity and data directory, and retains its identity after
      restart.
    zh: 每台设备保留独立身份和数据目录，重启后仍使用原身份。
  membership:
    en: Authorized joins, roster changes, exits and dissolution converge across the affected office
      members.
    zh: 获得授权的加入、成员变更、退出和解散会在相关办公室成员之间同步。
  availability:
    en: The office reports unavailable members, restores membership after restart and does not invent
      authority without quorum.
    zh: 办公室能反映成员不可用，在重启后恢复成员关系，且不会在不足法定多数时自行确立主机。
  records:
    en: Task identities, names, activity and accessible conversation history agree across participating
      devices.
    zh: 参与设备看到一致的任务身份、名称、活动记录与有权读取的对话历史。
  delivery:
    en: An authorized cross-device request reaches its recipient and produces an observable receipt or a
      persisted real reply according to the scenario.
    zh: 获得授权的跨设备请求能到达接收者，并按场景产生可观察的接收回执或持久化真实回复。
  isolation:
    en: Different offices and their members retain separate identities and access boundaries.
    zh: 不同办公室及其成员保留各自身份和访问边界。
scenarios:
  - id: offices.cluster.independent-identities
    title:
      en: Independent nodes expose distinct identities and working endpoints
      zh: 各节点具有独立身份和可用入口
    verifies:
      - identity
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: 3 isolated built Halo processes run on one computer.
        zh: 3 个已构建且数据隔离的 Halo 进程运行在同一台电脑上。
    expected:
      - en: Independent nodes expose distinct identities and working endpoints
        zh: 各节点具有独立身份和可用入口
    notes:
      en: The driver uses real HTTP, WebSocket, SQLite and process lifecycle. This evidence does not
        verify renderer interactions or physical cross-machine network behavior.
      zh: 驱动使用真实 HTTP、WebSocket、SQLite 和进程生命周期；此证据不验证界面交互或真实跨机器网络行为。
