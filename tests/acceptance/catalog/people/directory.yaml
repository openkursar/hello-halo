version: 1
id: people.directory
module: people
title:
  en: Find a digital human
  zh: 找到需要的数字人
story:
  en: I can find a person by name or team and return to the same list.
  zh: 我能按名字或团队找到数字人，并回到原列表。
basis: observed
references:
  - src/renderer/components/apps/PeopleDirectory.tsx
  - tests/e2e/specs/people-upgrade.spec.ts
promises:
  browse:
    en: Search, paging and return navigation preserve list context and include persistent coordinators.
    zh: 搜索、分页和返回保留列表上下文，长期协调者也能找到。
  scale:
    en: Large directories remain bounded and usable at narrow widths.
    zh: 大量数字人时列表仍有限加载，窄屏也可操作。
  live-status:
    en: A digital human working a team turn reads as working wherever its status shows — the space rail, the people switcher and the directory — and a team lead appears in its space’s rail marked as the team lead, without being offered as a chat recipient.
    zh: 正在处理团队任务的数字人，在所有显示状态的地方（空间右栏、人员切换条、目录）都显示为工作中；团队 Lead 出现在所在空间的右栏并标为团队 Lead，但不作为聊天收件人提供。
scenarios:
  - id: people.directory.team-work-status
    title:
      en: See a team member at work outside the team view
      zh: 在团队视图之外看到正在工作的团队成员
    verifies:
      - live-status
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: A saved team with its lead and a member installed in the current space; no scheduled run is in progress.
        zh: 当前空间有一个已保存团队，含 Lead 和一名成员；没有定时运行在进行。
    steps:
      - en: Send the member a message in the team view, then look at the space rail’s digital humans tab and the people switcher while it answers, and after it finishes.
        zh: 在团队视图给成员发消息，在其回复期间及结束后查看空间右栏数字人标签和人员切换条。
    expected:
      - en: The member reads Working while it answers and Standing by afterwards; the lead is listed with a team lead mark and no Chat action.
        zh: 成员回复期间显示工作中，结束后显示待命；Lead 带团队 Lead 标识列出，且无聊天入口。
  - id: people.directory.browse
    title:
      en: Search, open and return to the directory
      zh: 搜索、查看并返回目录
    verifies:
      - browse
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - fast
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Seed multiple digital humans and a persistent team coordinator.
        zh: 预置多个数字人与长期团队协调者。
    steps:
      - en: Search by team, open a person’s settings, return and page the list.
        zh: 按团队搜索，进入个人设置，返回并翻页。
    expected:
      - en: The correct people appear, search text is retained and pages stay bounded.
        zh: 显示正确数字人，搜索词保留，分页大小受控。
  - id: people.directory.scale
    title:
      en: Browse a large directory on a narrow screen
      zh: 窄屏浏览大量数字人
    verifies:
      - scale
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Seed 200 people and pending requests.
        zh: 预置 200 位数字人与待处理请求。
    steps:
      - en: Browse at desktop, 375px and 320px in both themes.
        zh: 在桌面、375px 与 320px 下切换两种主题浏览。
    expected:
      - en: Cards remain paged, detail controls remain reachable and the page does not overflow horizontally.
        zh: 卡片分页显示，详情控件可达，页面不横向溢出。
