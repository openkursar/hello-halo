version: 1
id: people.settings
module: people
title:
  en: Configure a digital human independently
  zh: 独立配置数字人
story:
  en: I can adjust one digital human’s identity, working context and capabilities without changing everyone else.
  zh: 我能修改某位数字人的身份、工作环境和能力，而不影响所有其他数字人。
basis: observed
references:
  - src/renderer/components/apps/AppConfigPanel.tsx
  - tests/e2e/specs/people-settings.spec.ts
  - src/main/apps/manager/service.ts
  - tests/e2e/specs/acceptance-people.spec.ts
  - src/main/apps/team/service.ts
  - tests/e2e/specs/acceptance-people-settings-reload.spec.ts
promises:
  reload:
    en: Explicitly restarting a chat after saving a digital human's instructions applies those instructions to the original conversation without losing its history or the engine's native guidance; new chats and later application restarts retain the saved instructions.
    zh: 保存数字人指令后明确重启聊天，原对话采用保存指令且保留历史及引擎原生指导；新对话和后续应用重启继续使用保存指令。
  unchanged:
    en: A stored conversation with no settings change or explicit configuration reload can continue after application restart with its saved instructions and history, without requiring migration to new product instructions.
    zh: 未改设置且未明确重载配置的存储对话，在应用重启后可按已保存指令和历史继续，无需迁移到新产品指令。
  save:
    en: Unsaved settings remain identifiable until saved or cancelled.
    zh: 未保存设置有明确标识，可保存或取消。
  workspace:
    en: Changing or retiring a person preserves or removes workspace data only as stated by the action.
    zh: 修改或停用数字人只按操作说明保留或移除工作数据。
  legible:
    en: Settings sections and long person names remain usable on narrow screens.
    zh: 设置分组和长数字人名称在窄屏仍可使用。
  validation:
    en: Invalid required identity fields are explained without replacing the last saved person definition.
    zh: 无效必填身份字段有说明，不替换最后保存的数字人定义。
  team-name:
    en: A renamed digital human appears under its new name in every team where its name followed the person name, while a name chosen for a team stays and teammates addressing the old name still reach it.
    zh: 数字人改名后，在其名称跟随数字人名称的每个团队中都显示新名；为团队单独取的名称保持不变，队友按旧名称寻址仍能送达。
  web-search:
    en: Web search can be switched off for one digital human; while off it does not search the web in its chats, IM chats, team work or scheduled runs, and nobody it works for can turn it back on. Opening a page it is given and the AI Browser are separate and stay as they are. Memory stays on.
    zh: 可以为某位数字人关闭网页搜索；关闭后它在自己的对话、IM 对话、团队协作和定时运行中都不再搜索网页，它服务的任何人都无法重新打开。打开给定的网页链接和 AI 浏览器是独立能力，不受影响。记忆始终开启。
scenarios:
  - id: people.settings.im-continue-instructions
    title:
      en: Continue an old Claude Code IM conversation in the client
      zh: 在客户端继续旧 Claude Code IM 对话
    verifies: [reload, unchanged]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      binding: [legacy-reload, modern-reload, legacy-unchanged]
    preconditions:
      - An isolated app explicitly selects installed Claude Code through HALO_ACCEPTANCE_CLAUDE_CLI, with a local scripted model and local synthetic WeCom protocol server.
      - A real native Claude Code IM turn creates stored history. While the app is stopped, only its synthetic app-owned session binding row is converted to a legacy string for legacy variants; engine-owned snapshots are not edited.
    steps:
      - Restart the app. For reload variants save changed digital-human instructions and use Quick restart without sending another message in the source IM conversation.
      - Open that actual IM history and choose Continue in client, then send the first message in the new local conversation.
      - Restart the app and continue the same destination conversation again.
    expected:
      - Reload variants deliver the latest instructions in the destination's first and subsequent model requests; the unchanged legacy control keeps the original instructions.
      - Requests retain native Claude Code guidance, exactly one Halo host context and prior source history. The destination retains its own new turns across application restart.
      - The destination has a distinct local conversation and native session ID. Its sends never add turns or replies to the source IM conversation and leave its binding and history unchanged.
    notes: The legacy fixture tests the historical app binding representation using history genuinely created by the installed native CLI, not an older CLI snapshot format. Scripted observations prove instruction delivery and application persistence, not live-model answer quality, remote IM delivery or Codex behavior.
  - id: people.settings.reload-instructions
    title:
      en: Reload saved instructions in the original chat
      zh: 在原聊天重载已保存指令
    verifies: [reload]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      engine: [halo, anthropic]
    preconditions:
      - An isolated application explicitly selects the tested engine without fallback. Claude Code requires a separately installed executable selected through HALO_ACCEPTANCE_CLAUDE_CLI.
      - A digital human has synthetic instructions and an existing chat with known history.
    steps:
      - Save changed instructions through Identity & Instructions, use Quick restart and continue the exact original conversation.
      - Open a distinct new chat, then restart the isolated application and continue the original conversation again.
    expected:
      - Provider requests use the updated system instructions without the obsolete instructions, retain native engine guidance and contain exactly one Halo host context.
      - The original conversation keeps its identity and all user and assistant turns across both restarts; the new conversation starts separately with updated instructions.
    notes: Scripted provider observations establish instruction delivery, not live-model answer quality or permission enforcement. Permissions retain their separate acceptance coverage.
  - id: people.settings.resume-unchanged
    title:
      en: Continue an unchanged stored chat after application restart
      zh: 应用重启后继续未修改的存储聊天
    verifies: [unchanged]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      engine: [halo, anthropic]
    preconditions:
      - An isolated application explicitly selects the tested engine without fallback. Claude Code requires a separately installed executable selected through HALO_ACCEPTANCE_CLAUDE_CLI.
      - A digital human has saved synthetic instructions and an existing chat with known history.
    steps:
      - Without editing settings or using Quick restart, restart the isolated application and continue the exact original conversation.
    expected:
      - The chat retains its identity, saved instructions and all user and assistant turns; the provider receives its prior context and native guidance with one Halo host context.
    notes: This does not require unchanged historical sessions to acquire newer product instructions or migrate their native session binding.
  - id: people.settings.team-name
    title:
      en: Rename a person who belongs to teams
      zh: 为已加入团队的数字人改名
    verifies:
      - team-name
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A person belongs to two teams under its own name and to a third under a name chosen for that team.
        zh: 某数字人以自身名称加入两个团队，并以单独取的名称加入第三个团队。
    steps:
      - en: Rename the person in its settings, then open each team’s member list.
        zh: 在设置中改名，然后打开每个团队的成员列表。
    expected:
      - en: The first two teams show the new name (made unique if a teammate already holds it); the third keeps its chosen name.
        zh: 前两个团队显示新名称（若已有队友同名则自动区分）；第三个团队保留单独取的名称。
  - id: people.settings.web-search-off
    title:
      en: Switch web search off for one digital human
      zh: 为一位数字人关闭网页搜索
    verifies:
      - web-search
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A digital human with default capabilities and a scheduled task.
        zh: 一位能力为默认设置并有定时任务的数字人。
    steps:
      - en: Open its Settings → Capabilities, expand “Other”, switch Web Search off, then ask it in chat to look something up online, ask it to summarise a link you paste, and run its scheduled task.
        zh: 打开它的设置 → 能力，展开「其他」，关闭网页搜索，然后在对话中让它上网查资料，再贴一个链接让它总结，并运行它的定时任务。
    expected:
      - en: Neither the chat nor the run searches the web; the AI says web search is off and where to turn it on. The pasted link is still opened and summarised. Memory shows as always on with no switch.
        zh: 对话和运行都不搜索网页；AI 说明网页搜索已关闭以及在哪里打开。贴的链接仍能打开并总结。记忆显示为始终开启且没有开关。
  - id: people.settings.unsaved
    title:
      en: Save one settings group
      zh: 保存一组个人设置
    verifies:
      - save
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A person’s settings page is open.
        zh: 已打开个人设置页。
    steps:
      - en: Edit identity text, navigate between groups and save.
        zh: 修改身份文字，在分组间切换后保存。
    expected:
      - en: The edited group is marked before save and persisted values appear after reopening.
        zh: 保存前分组有未保存标记，重开后保留保存值。
  - id: people.settings.retire
    title:
      en: Retire a person and inspect retained work
      zh: 停用数字人并查看保留的工作
    verifies:
      - workspace
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A disposable person owns messages and generated files.
        zh: 测试数字人已有消息与生成文件。
    steps:
      - en: Use the retire/uninstall action and inspect its retained detail and files.
        zh: 执行停用或卸载并查看保留详情与文件。
    expected:
      - en: The person stops receiving new work and retention follows the stated choice.
        zh: 数字人不再接收新任务，数据按所选保留规则处理。
  - id: people.settings.save-identity
    title:
      en: Save a changed person name
      zh: 保存修改后的数字人名称
    verifies:
      - save
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use the isolated fixture described by the referenced executable test.
        zh: 使用引用测试中定义的隔离测试资料。
    steps:
      - en: Change the person name, inspect its dirty marker and save the identity group.
        zh: 修改名称，查看未保存标识并保存身份分组。
    expected:
      - en: The marker clears and the application API reads the saved name.
        zh: 标识清除，应用 API 读到已保存名称。
  - id: people.settings.group-navigation
    title:
      en: Navigate to the intended settings group
      zh: 导航到预期设置分组
    verifies:
      - legible
    platforms: &a2
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Use each settings-group navigation entry, including collapsed advanced settings.
        zh: 使用设置分组导航，包括折叠的高级设置。
    expected:
      - en: The selected group appears in view and advanced sections open through their own controls.
        zh: 选定分组进入视口，高级分组通过自己的控件展开。
  - id: people.settings.narrow-groups
    title:
      en: Reach every settings group at narrow width
      zh: 窄屏到达每个设置分组
    verifies:
      - legible
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Resize person settings to 375px and navigate to a far group in the scrolling strip.
        zh: 把个人设置缩至 375px，并从滚动导航到远处分组。
    expected:
      - en: The strip scrolls, the requested group is reachable and the panel does not overflow.
        zh: 导航可滚动，目标分组可达，面板不溢出。
  - id: people.settings.long-names
    title:
      en: Read long names during bot reassignment
      zh: 重新绑定机器人时阅读长名称
    verifies:
      - legible
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Give a person a long name and inspect the bot picker and transfer confirmation.
        zh: 为数字人设置长名称并查看机器人选择器及转移确认。
    expected:
      - en: The full identifying name remains present and its containers do not overflow horizontally.
        zh: 身份名称完整保留，容器不横向溢出。
    variants:
      width:
        - "1280"
        - "375"
  - id: people.settings.validation
    title:
      en: Reject invalid identity edits and restore saved values
      zh: 拒绝无效身份修改并恢复保存值
    verifies:
      - save
      - validation
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A valid digital human has a saved name, description and instructions.
        zh: 有效数字人已保存名称、描述和指令。
    steps:
      - en: Try saving a blank name and then a blank description, inspect validation errors and Reset.
        zh: 尝试保存空名称和空描述，查看校验错误并重置。
    expected:
      - en: Each validation failure preserves the stored definition; Reset restores the saved fields.
        zh: 每次校验失败保留存储定义，重置恢复保存字段。
  - id: people.settings.purge
    title:
      en: Confirm permanent removal separately from uninstall
      zh: 在卸载之后单独确认永久删除
    verifies:
      - workspace
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Two manual digital humans have files in their own isolated data folders.
        zh: 两位手动创建数字人在各自隔离数据目录中有文件。
    steps:
      - en: Uninstall one person, cancel permanent removal, then confirm it and restart.
        zh: 卸载其中一位，取消永久删除，再确认删除并重启。
    expected:
      - en: Cancellation retains the removed person and files; confirmation removes only that person’s record and data, leaving the other intact.
        zh: 取消保留已卸载数字人及文件；确认只删除该人的记录与数据，另一位保持完整。
