version: 1
id: people.settings
module: people
title:
  en: Configure a digital human independently
  zh: 独立配置数字人
story:
  en: I can adjust one digital human’s identity, working context and capabilities without changing everyone else.
  zh: 我能修改某位数字人的身份、工作环境和能力，而不影响所有其他数字人。
basis: observed
references:
  - src/renderer/components/apps/AppConfigPanel.tsx
  - tests/e2e/specs/people-settings.spec.ts
  - src/main/apps/manager/service.ts
  - src/main/apps/runtime/space-change.ts
  - src/renderer/components/apps/WorkspaceMigrationDialog.tsx
  - tests/e2e/specs/acceptance-people.spec.ts
  - src/main/apps/team/service.ts
  - tests/e2e/specs/acceptance-people-settings-reload.spec.ts
  - tests/e2e/specs/acceptance-digital-human-workspace-move.spec.ts
  - tests/e2e/specs/acceptance-workspace-move-collaborator.spec.ts
promises:
  reload:
    en: Explicitly restarting a chat after saving a digital human's instructions applies those instructions to the original conversation without losing its history or the engine's native guidance; new chats and later application restarts retain the saved instructions.
    zh: 保存数字人指令后明确重启聊天，原对话采用保存指令且保留历史及引擎原生指导；新对话和后续应用重启继续使用保存指令。
  unchanged:
    en: A stored conversation with no settings change or explicit configuration reload can continue after application restart with its saved instructions and history, without requiring migration to new product instructions.
    zh: 未改设置且未明确重载配置的存储对话，在应用重启后可按已保存指令和历史继续，无需迁移到新产品指令。
  save:
    en: Unsaved settings remain identifiable until saved or cancelled.
    zh: 未保存设置有明确标识，可保存或取消。
  workspace:
    en: Changing or retiring a person preserves or removes workspace data only as stated by the action.
    zh: 修改或停用数字人只按操作说明保留或移除工作数据。
  move:
    en: Changing a digital human's workspace moves its memory, all conversations and pending decisions together without moving project files. The preview explains which ongoing work will stop; cancellation changes nothing. Deleting the former workspace afterwards does not affect the person.
    zh: 更换数字人的工作区时，记忆、全部对话和待回答决定一起搬迁，项目文件不动。预览说明会停止的进行中工作；取消不产生变化。之后删除原工作区不会影响该数字人。
  recovery:
    en: A digital human left partly moved by an older version becomes usable automatically after upgrade, including when the former workspace is gone. Surviving memory and conversations are merged into its current workspace without discarding conflicting files; already deleted memory cannot be recovered.
    zh: 旧版本造成的半搬家数字人在升级后自动恢复可用，即使原工作区已经不存在。仍存在的记忆与对话合并到当前工作区，冲突文件不丢弃；已删除的记忆无法找回。
  legible:
    en: Settings sections and long person names remain usable on narrow screens.
    zh: 设置分组和长数字人名称在窄屏仍可使用。
  validation:
    en: Invalid required identity fields are explained without replacing the last saved person definition.
    zh: 无效必填身份字段有说明，不替换最后保存的数字人定义。
  team-name:
    en: A renamed digital human appears under its new name in every team where its name followed the person name, while a name chosen for a team stays and teammates addressing the old name still reach it.
    zh: 数字人改名后，在其名称跟随数字人名称的每个团队中都显示新名；为团队单独取的名称保持不变，队友按旧名称寻址仍能送达。
  web-search:
    en: Web search can be switched off for one digital human; while off it does not search the web in its chats, IM chats, team work or scheduled runs, and nobody it works for can turn it back on. Opening a page it is given and the AI Browser are separate and stay as they are. Memory stays on.
    zh: 可以为某位数字人关闭网页搜索；关闭后它在自己的对话、IM 对话、团队协作和定时运行中都不再搜索网页，它服务的任何人都无法重新打开。打开给定的网页链接和 AI 浏览器是独立能力，不受影响。记忆始终开启。
scenarios:
  - id: people.settings.move-collaborator
    title:
      en: Keep an idle collaborator's original work through a digital-human workspace move
      zh: 数字人搬家时保留空闲协作者的原工作
    verifies: [workspace]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      placement: [default]
    preconditions:
      - en: An isolated digital human's original local chat creates a real temporary collaborator. Its first native turn finishes with a known private reply. The collaborator uses the default internal working directory.
        zh: 隔离数字人的原本地聊天创建真实临时协作者，协作者首次原生运行完成并产生已知私有回复；协作者使用默认内部工作目录。
    steps:
      - en: Move the digital human through the workspace preview and confirmation, delete its former workspace and restart the application. Continue the same collaborator through its original team/member conversation and then continue the source digital-human chat separately.
        zh: 通过工作区预览及确认搬迁数字人，删除原工作区并重启应用；通过原团队成员对话继续同一协作者，再单独继续数字人来源聊天。
    expected:
      - en: The collaborator keeps its identity, work scope, permissions, local metadata and original native transcript. Its metadata and transcript storage move with the digital human; the default internal working directory follows the destination.
        zh: 协作者保留身份、工作范围、权限、本地元数据及原生历史；其元数据和历史存储跟随数字人搬迁，默认内部工作目录跟随目标工作区。
      - en: After restart the same collaborator receives its prior private assistant reply in native model context and responds in its original member conversation. The owner's original chat retains its own history and native identity and can continue independently.
        zh: 重启后，同一协作者的原生模型上下文收到先前私有助手回复，并在原成员对话中回应；所有者原聊天保留自身历史及原生身份，可独立继续。
    notes: Model replacement uses only the local scripted endpoint. Participant execution records and native bindings are read-only evidence; no app handlers or native engine snapshots are replaced.
  - id: people.settings.move-delete-origin
    title:
      en: Move a digital human completely and delete the former workspace
      zh: 数字人彻底搬家后删除原工作区
    verifies: [move]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - en: An isolated digital human has known memory, desktop and synthetic WeCom conversation history, a pending decision, one ongoing task and a configured schedule. The destination workspace has a separate project folder.
        zh: 隔离数字人已有已知记忆、桌面与模拟企业微信对话历史、一项待回答决定、一项进行中任务及定时配置；目标工作区有独立项目文件夹。
    steps:
      - en: Open Change workspace from the person's menu, select the destination, inspect the preview and cancel once.
        zh: 从数字人菜单打开更换工作区，选择目标，查看预览并先取消一次。
      - en: Preview again and confirm Move here, then delete the former workspace.
        zh: 再次预览并确认搬到这里，然后删除原工作区。
      - en: Continue the same desktop and synthetic WeCom conversations, answer the pending decision, open the person's page and let the configured scheduled task run. Restart and inspect the conversations and memory again.
        zh: 继续原桌面及模拟企业微信对话、回答待决定问题、打开数字人页面并让配置好的定时任务执行；重启后再次检查对话和记忆。
    expected:
      - en: The preview says memory and all conversations move together, project files stay and one ongoing item will stop. Cancellation does not stop work or move any data.
        zh: 预览说明记忆与全部对话一起搬迁、项目文件不动且会停止一项进行中工作；取消不停止工作也不搬迁数据。
      - en: Confirmation stops that task, retains the pending decision and moves the person's complete history and surviving memory. Project folders are unchanged by the move.
        zh: 确认会停止该任务、保留待回答决定并搬迁数字人的完整历史和仍存在的记忆；搬迁不改变项目文件夹。
      - en: After the former workspace is deleted, the original desktop and IM histories remain visible, both chats continue, the decision can be answered and scheduled work can run. The person's page and retained memory remain usable after restart.
        zh: 删除原工作区后，原桌面及 IM 历史仍可查看，两种对话均可继续，决定可回答且定时任务可执行；重启后数字人页面及保留记忆仍可用。
    notes: Synthetic WeCom verifies the local application protocol path, not delivery through a live external IM service.
  - id: people.settings.move-active-chat
    title:
      en: Count a running reply before moving at narrow width
      zh: 窄屏搬家前显示正在回复的停止数量
    verifies: [move, legible]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - A digital human has one active chat reply, one active task and a pending decision; the destination has long skill and connection names.
    steps:
      - At 375px width, open Change workspace and preview the destination, then cancel. Reopen and confirm the move.
    expected:
      - The preview counts two ongoing items that will stop, separately describes decisions and sessions moving, and keeps long names and actions readable without horizontal overflow.
      - Cancellation leaves both active items running. Confirmation stops both, moves the pending decision and preserves conversation history.
  - id: people.settings.legacy-move-repair
    title:
      en: Repair a legacy partial move automatically after upgrade
      zh: 升级后自动修复旧版半搬家
    verifies: [recovery]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      origin: [available, deleted]
    preconditions:
      - en: An isolated legacy fixture assigns a digital human to a destination while memory and old conversation environments still point to its former workspace. New conversation files already exist in the destination. The available-origin fixture includes distinct source-only and destination-only files and a conflicting filename; the deleted-origin fixture has lost its original memory directory.
        zh: 隔离旧版资料中，数字人已归属目标工作区，但记忆与旧对话环境仍指向原工作区，目标中已有新对话文件；原工作区仍在的资料包含各自独有文件和同名冲突文件，原工作区已删除的资料已丢失原记忆目录。
    steps:
      - en: Start the upgraded application without manually repairing files or settings, open the person's old conversations, send a message and execute its scheduled work. Restart once more.
        zh: 不手动修文件或设置，启动新版应用，打开数字人旧对话、发送消息并执行其定时任务，再重启一次。
    expected:
      - en: The person's page, old conversation continuation and scheduled work are usable without restoring the former workspace or requiring a user migration step.
        zh: 无需恢复原工作区或用户手动迁移，数字人页面、旧对话续聊及定时任务即可使用。
      - en: When the origin still exists, surviving memory and conversations are combined with the destination data, both versions of conflicting files survive and the source version has a .from-<origin-workspace-id> suffix. When the origin was deleted, lost memory is not presented as recovered.
        zh: 原工作区仍存在时，保留记忆和对话与目标数据合并，冲突文件两个版本均保留，源版本带 .from-<原工作区ID> 后缀；原工作区已删除时，不把丢失记忆说成已找回。
      - en: Subsequent restarts and deletion of an available former workspace do not remove the restored person's memory or history or make it unusable again.
        zh: 后续重启及删除仍存在的原工作区，不会删掉已恢复数字人的记忆和历史，也不会使其再次不可用。
    notes: Both origin variants use separate stopped-app legacy fixtures with app-owned records and files; native engine snapshots are not edited.
  - id: people.settings.missing-workspace-recovery
    title:
      en: Continue retained conversations when their pinned workspace is missing
      zh: 原绑定工作区不存在时继续保留的对话
    verifies: [workspace]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - en: An isolated digital human belongs to an available workspace and has genuine native desktop and synthetic WeCom conversation history retained there. Its data_path is empty, but old session environments still point to a missing former workspace. Original memory has been deleted.
        zh: 隔离数字人归属可用工作区，其中保留真实原生桌面对话及模拟企业微信历史；data_path 为空，但旧会话环境仍指向不存在的原工作区，原记忆已删除。
    steps:
      - en: Start the application without repairing files or settings, continue the original desktop and synthetic WeCom conversations and let its configured schedule run. Restart and continue the original desktop conversation again.
        zh: 不修复文件或设置，启动应用，继续原桌面及模拟企业微信对话，并让配置的定时任务运行；重启后再次继续原桌面对话。
    expected:
      - en: Both original conversations continue in the person's current workspace with their original native session identities and prior user and assistant context. Used session environments are rewritten to the current workspace without asking the user to restore the former workspace.
        zh: 两种原对话均在数字人当前工作区继续，保留原生会话身份及先前用户和助手上下文；已使用会话环境改写为当前工作区，无需用户恢复原工作区。
      - en: Scheduled work succeeds and the original desktop conversation remains usable after restart. Already deleted memory is not presented as recovered.
        zh: 定时工作执行成功，重启后原桌面对话仍可用；已删除记忆不被说成已恢复。
    notes: The stopped isolated fixture changes only app-owned records and files; native engine snapshots are not edited. Synthetic WeCom verifies the local protocol path, not live external delivery.
  - id: people.settings.im-continue-instructions
    title:
      en: Continue an old Claude Code IM conversation in the client
      zh: 在客户端继续旧 Claude Code IM 对话
    verifies: [reload, unchanged]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [local-claude-code]
    variants:
      binding: [legacy-reload, modern-reload, legacy-unchanged]
    preconditions:
      - An isolated app explicitly selects installed Claude Code through HALO_ACCEPTANCE_CLAUDE_CLI, with a local scripted model and local synthetic WeCom protocol server.
      - A real native Claude Code IM turn creates stored history. While the app is stopped, only its synthetic app-owned session binding row is converted to a legacy string for legacy variants; engine-owned snapshots are not edited.
    steps:
      - Restart the app. For reload variants save changed digital-human instructions and use Quick restart without sending another message in the source IM conversation.
      - Open that actual IM history and choose Continue in client, then send the first message in the new local conversation.
      - Restart the app and continue the same destination conversation again.
    expected:
      - Reload variants deliver the latest instructions in the destination's first and subsequent model requests; the unchanged legacy control keeps the original instructions.
      - Requests retain native Claude Code guidance, exactly one Halo host context and prior source history. The destination retains its own new turns across application restart.
      - The destination has a distinct local conversation and native session ID. Its sends never add turns or replies to the source IM conversation and leave its binding and history unchanged.
    notes: The legacy fixture tests the historical app binding representation using history genuinely created by the installed native CLI, not an older CLI snapshot format. Scripted observations prove instruction delivery and application persistence, not live-model answer quality, remote IM delivery or Codex behavior.
  - id: people.settings.reload-instructions
    title:
      en: Reload saved instructions in the original chat
      zh: 在原聊天重载已保存指令
    verifies: [reload]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      engine: [halo, anthropic]
    preconditions:
      - An isolated application explicitly selects the tested engine without fallback. Claude Code requires a separately installed executable selected through HALO_ACCEPTANCE_CLAUDE_CLI.
      - A digital human has synthetic instructions and an existing chat with known history.
    steps:
      - Save changed instructions through Identity & Instructions, use Quick restart and continue the exact original conversation.
      - Open a distinct new chat, then restart the isolated application and continue the original conversation again.
    expected:
      - Provider requests use the updated system instructions without the obsolete instructions, retain native engine guidance and contain exactly one Halo host context.
      - The original conversation keeps its identity and all user and assistant turns across both restarts; the new conversation starts separately with updated instructions.
    notes: Scripted provider observations establish instruction delivery, not live-model answer quality or permission enforcement. Permissions retain their separate acceptance coverage.
  - id: people.settings.resume-unchanged
    title:
      en: Continue an unchanged stored chat after application restart
      zh: 应用重启后继续未修改的存储聊天
    verifies: [unchanged]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      engine: [halo, anthropic]
    preconditions:
      - An isolated application explicitly selects the tested engine without fallback. Claude Code requires a separately installed executable selected through HALO_ACCEPTANCE_CLAUDE_CLI.
      - A digital human has saved synthetic instructions and an existing chat with known history.
    steps:
      - Without editing settings or using Quick restart, restart the isolated application and continue the exact original conversation.
    expected:
      - The chat retains its identity, saved instructions and all user and assistant turns; the provider receives its prior context and native guidance with one Halo host context.
    notes: This does not require unchanged historical sessions to acquire newer product instructions or migrate their native session binding.
  - id: people.settings.team-name
    title:
      en: Rename a person who belongs to teams
      zh: 为已加入团队的数字人改名
    verifies:
      - team-name
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A person belongs to two teams under its own name and to a third under a name chosen for that team.
        zh: 某数字人以自身名称加入两个团队，并以单独取的名称加入第三个团队。
    steps:
      - en: Rename the person in its settings, then open each team’s member list.
        zh: 在设置中改名，然后打开每个团队的成员列表。
    expected:
      - en: The first two teams show the new name (made unique if a teammate already holds it); the third keeps its chosen name.
        zh: 前两个团队显示新名称（若已有队友同名则自动区分）；第三个团队保留单独取的名称。
  - id: people.settings.web-search-off
    title:
      en: Switch web search off for one digital human
      zh: 为一位数字人关闭网页搜索
    verifies:
      - web-search
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: A digital human with default capabilities and a scheduled task.
        zh: 一位能力为默认设置并有定时任务的数字人。
    steps:
      - en: Open its Settings → Capabilities, expand “Other”, switch Web Search off, then ask it in chat to look something up online, ask it to summarise a link you paste, and run its scheduled task.
        zh: 打开它的设置 → 能力，展开「其他」，关闭网页搜索，然后在对话中让它上网查资料，再贴一个链接让它总结，并运行它的定时任务。
    expected:
      - en: Neither the chat nor the run searches the web; the AI says web search is off and where to turn it on. The pasted link is still opened and summarised. Memory shows as always on with no switch.
        zh: 对话和运行都不搜索网页；AI 说明网页搜索已关闭以及在哪里打开。贴的链接仍能打开并总结。记忆显示为始终开启且没有开关。
