version: 1
id: models.engines
module: models
title:
  en: Select an installed application engine
  zh: 选择已安装的应用执行引擎
story:
  en: I can choose which engine new conversations start on, see that existing conversations keep theirs, and recognize fallback when a configured engine is missing.
  zh: 我能选择新对话使用的引擎，看到已有对话保持原引擎，并识别配置引擎缺失时的回退。
basis: documented
references:
  - src/main/services/agent/resolved-sdk.ts
  - src/main/services/agent/engine-availability.ts
  - src/renderer/components/settings/AdvancedSection.tsx
promises:
  selection:
    en: The default engine for new conversations changes without restarting the application, and each existing conversation keeps the engine it runs on until it is moved explicitly.
    zh: 新对话使用的默认引擎无需重启应用即可切换，已有对话保持其所用引擎，直到被明确迁移。
  fallback:
    en: A missing explicitly selected Claude Code installation fails without selecting another installation or engine; other engine fallback retains the saved choice.
    zh: 明确选择的 Claude Code 安装不可用时失败，不选择其他安装或引擎；其他引擎的回退保留保存的选择。
  upgrade:
    en: An ordinary upgrade never discovers Claude Code or rewrites all history. Ambiguous historical defaults and paths use Halo, while recorded user choices and a currently selected Claude Code delegated account remain selected. Compatible history resumes silently; unsafe recovery preserves history and fails.
    zh: 普通升级不发现 Claude Code、不批量改写历史。来源不明的旧默认值和路径使用 Halo，有记录的主动选择及当前选中的 Claude Code 委托账户保留。兼容历史正常恢复不提示；无法安全恢复时保留历史并失败。
scenarios:
  - id: models.engines.global-selection
    title:
      en: Apply a default engine choice to new conversations
      zh: 将默认引擎选择应用到新对话
    verifies:
      - selection
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated application starts on Halo, and both Halo and Claude Code are available on the host.
        zh: 隔离应用以 Halo 启动，主机上 Halo 与 Claude Code 两个引擎均可用。
    steps:
      - en: Complete a turn in one conversation, choose Claude Code as the default engine in Settings without restarting, then create a new conversation and complete a turn in both.
        zh: 在一个对话中完成一轮，在设置中不重启直接选择 Claude Code 为默认引擎，然后新建对话并在两个对话中各完成一轮。
    expected:
      - en: The new conversation stores and runs on Claude Code; the earlier conversation keeps and runs on Halo; engine reports match with no fallback.
        zh: 新对话保存并运行于 Claude Code，原对话保持并运行于 Halo；引擎报告一致且无回退。
    notes:
      en: The earlier restart-based check described an engine model that no longer exists and was removed. Claude Code is an optional external installation, so this case needs one on the host.
      zh: 此前基于重启的检查描述的引擎模型已不存在，已移除。Claude Code 是可选的外部安装，本例需要主机上已安装。
  - id: models.engines.unavailable
    title:
      en: Explain fallback from a missing engine
      zh: 说明缺失引擎的回退
    verifies:
      - fallback
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: Use isolated application data and supported installed engines.
        zh: 使用隔离应用数据及受支持的已安装引擎。
    steps:
      - en: Start a disposable build configured for an absent engine with another supported engine installed.
        zh: 启动一个配置引擎缺失、但装有其他受支持引擎的可丢弃构建。
    expected:
      - en: The application remains usable without rewriting the saved preference. An explicit Claude Code choice reports its unavailable installation without selecting another engine; other engine fallback identifies the actual engine.
        zh: 应用仍可使用，不改写保存偏好。明确选择 Claude Code 时报告安装不可用，不自动切换引擎；其他引擎回退说明实际引擎。
  - id: models.engines.upgrade-space
    title: Continue a historical space conversation on Halo
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      history: [native, transcript]
    expected:
      - Without a recorded explicit CC choice or currently selected claude-cli delegated account, availability reports CC as unconfigured and never inspects saved runtime paths, including when engine options are opened. Explicit selection, installation and user-triggered discovery remain available.
    notes: Source-build startup observation delegates filesystem calls unchanged and records runtime candidate reads and discovery traversal. Synthetic historical ownership over a real saved Halo-compatible session does not establish historical external CC writer compatibility or packaged-app behavior.
  - id: models.engines.explicit-missing
    title: Preserve an explicitly selected missing Claude Code installation
    verifies: [fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.upgrade-person
    title: Continue historical digital-human chat on Halo
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.upgrade-automation
    title: Start an independent task on Halo after an ordinary upgrade
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.explicit-installed
    title: Keep an explicitly selected external Claude Code installation
    verifies: [fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    notes: Requires a real external Claude Code process to finish one turn against the local scripted model, not a live model or delegated login. HOME, USERPROFILE and the custom SDK config are isolated; owner credentials must not be supplied. If the selected CLI requires login despite the scripted API-key route, record the prerequisite as blocked rather than borrowing an account or counting a skip as passed.
  - id: models.engines.upgrade-delegated
    title: Retain Claude Code for the currently selected historical delegated account
    verifies: [upgrade, fallback]
    platforms: [darwin]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    variants:
      runtime: [installed, missing]
    notes: Seeds the real persisted delegated-source shape and checks engine selection without logging in or sending a model request. The installed variant requires a real isolated external CC runtime; absence is blocked. This does not establish delegated login or successful authenticated inference. Only the currently selected claude-cli delegated source counts as active choice; other historical defaults still use Halo.
  - id: models.engines.ordinary-upgrade
    title:
      en: Continue old conversations without discovering external runtimes
      zh: 不发现外部运行时即可继续旧对话
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements: [halo-sdk]
    variants:
      entry: [space-chat, digital-human, im, automation-followup]
    preconditions:
      - en: An isolated profile has historical Claude Code defaults, paths and automatic bindings without recorded user selection, and synthetic saved history.
        zh: 隔离资料包含没有主动选择记录的旧 Claude Code 默认值、路径和自动绑定，以及合成历史。
    steps:
      - en: Start the app and continue the old conversation. Repeat with missing native history and then with neither recovery source available.
        zh: 启动应用并继续旧对话；分别测试原生历史缺失，以及两个恢复来源都不可用。
    expected:
      - en: Startup and continuation discover no external installation and perform no bulk rewrite. Compatible history reaches Halo without a migration notice or tool replay. Bounded fallback is disclosed; unrecoverable history remains intact and the turn fails. Conversation rows have no historical engine badge.
        zh: 启动与续聊不发现外部安装、不批量改写。兼容历史进入 Halo，不显示迁移提示、不重放工具。有损回退如实说明；不可恢复时历史保留且本轮失败。对话列表不显示历史引擎标签。
