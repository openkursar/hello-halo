version: 1
id: models.engines
module: models
title:
  en: Select an installed application engine
  zh: 选择已安装的应用执行引擎
story:
  en: I can choose which engine new conversations start on, see that existing conversations keep theirs, and recognize fallback when a configured engine is missing.
  zh: 我能选择新对话使用的引擎，看到已有对话保持原引擎，并识别配置引擎缺失时的回退。
basis: documented
references:
  - src/main/services/agent/resolved-sdk.ts
  - src/main/services/agent/engine-availability.ts
  - src/renderer/components/settings/AdvancedSection.tsx
promises:
  selection:
    en: The default engine for new conversations changes without restarting the application, and each existing conversation keeps the engine it runs on until it is moved explicitly.
    zh: 新对话使用的默认引擎无需重启应用即可切换，已有对话保持其所用引擎，直到被明确迁移。
  fallback:
    en: A missing explicitly selected Claude Code or Codex installation fails without selecting another installation or engine, preserving the saved preference, input and history; other engine fallback retains the saved choice.
    zh: 明确选择的 Claude Code 或 Codex 安装不可用时失败，不选择其他安装或引擎，保留偏好、输入与历史；其他引擎的回退保留保存的选择。
  external-setup:
    en: Claude Code and Codex use the same in-place setup flow for explicit installation, download sources, local discovery and selection, cancellation, offline reuse and recovery. Closing the panel does not cancel installation; the latest explicit engine or installation choice wins.
    zh: Claude Code 与 Codex 使用相同的就地设置流程，支持显式安装、下载来源、本机发现与选用、取消、离线复用和恢复。关闭面板不取消安装，最近一次明确的引擎或安装选择优先。
  task-tracking:
    en: Claude Code conversations retain the task checklist on non-Claude models when the tool is allowed; an explicitly disabled checklist tool remains unavailable.
    zh: Claude Code 对话在非 Claude 模型上仍保留待办清单能力；用户明确禁用清单工具时，它保持不可用。
  upgrade:
    en: An ordinary upgrade never discovers Claude Code or rewrites all history. Ambiguous historical defaults and paths use Halo, while recorded user choices and a currently selected Claude Code delegated account remain selected. Compatible history resumes silently; unsafe recovery preserves history and fails.
    zh: 普通升级不发现 Claude Code、不批量改写历史。来源不明的旧默认值和路径使用 Halo，有记录的主动选择及当前选中的 Claude Code 委托账户保留。兼容历史正常恢复不提示；无法安全恢复时保留历史并失败。
scenarios:
  - id: models.engines.external-idle
    title: Open Halo and external engine settings without discovering or probing unused runtimes
    verifies: [external-setup]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - An isolated fresh profile has neither an external runtime selection nor installed runtime catalog entries.
    steps:
      - Start Halo, open Advanced settings, then expand the Claude Code and Codex setup panels without requesting installation or discovery.
    expected:
      - Both panels show the setup actions without inspecting runtime candidate paths, traversing discovery directories or spawning either runtime. A bounded listing of each private managed-runtime root is allowed to initialize known state. No model request occurs.
    notes: The source-build observer delegates filesystem and child-process calls unchanged and records bounded vendor-candidate operations. It does not establish absence of all networking, synchronous filesystem calls, arbitrary user layouts or data-size-dependent startup work.
  - id: models.engines.codex-missing
    title: Keep the Codex choice, original history and unsent input when its external installation is missing
    verifies: [fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      entry: [default, bound]
    preconditions:
      - An isolated profile selects a nonexistent external Codex path and contains saved history. Either Codex is the default for a new conversation or an existing conversation explicitly selects Codex while Halo is the default.
    steps:
      - With the Codex default, request a new conversation through the real application API. With an explicit existing Codex conversation, open it, enter a draft and try to send it.
    expected:
      - Creating the new conversation fails with an unavailable Codex explanation without changing the default or existing history. Sending in the explicitly selected Codex conversation fails with an actionable recovery entry, preserving its draft, history and choice. Neither path makes a model request or falls back.
    notes: Uses actual application handlers and a local scripted model observer without executing Codex. The default variant checks the API creation boundary, not a new-conversation UI recovery journey; the bound variant checks rendered recovery and retained input. It does not establish successful installation or recovery after installation.
  - id: models.engines.external-setup
    title: Install and manage either optional external runtime in the same inline settings flow
    verifies: [external-setup, selection, fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements: [halo-sdk]
    variants:
      engine: [anthropic, codex]
      journey: [recommended, mirror, local-selection, cancel-retry, offline-reuse, panel-reopen, latest-intent, state-isolation]
    expected:
      - Installation and local selection are explicit and validated. Existing defaults remain usable until selection succeeds; failures keep previous selection and actionable feedback.
      - Each engine retains its own status, progress, source and errors; older asynchronous work cannot override newer explicit choices.
    notes: Parameterized application bindings use explicit vendor artifact receipts and a loopback registry serving unchanged vendor artifact bytes. The recommended and mirror variants install the recommended release through an explicitly selected mirror, not the public vendor endpoint. Local selection checks an explicit fixture path, not the operating-system picker or discovery scan. State isolation checks per-engine persisted source fields, not all possible delayed responses. No paid model calls or personal credentials are authorized; bindings alone are not passing evidence.
  - id: models.engines.managed-codex-integrity
    title: Reject incomplete managed Codex integrity records without changing the selected engine
    verifies: [fallback, external-setup]
    platforms: [darwin]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [packaged-app, halo-sdk]
    variants:
      record: [no-integrity, no-version, missing-helper, wrong-pin]
    preconditions:
      - An isolated packaged application contains a synthetic managed Codex catalog with inert non-program bytes and one incomplete or incorrect integrity record.
    steps:
      - Read known status, check that exact managed path, then try selecting it through the real application APIs.
    expected:
      - Status and checking report unavailable with checksum-mismatch; selection fails with the typed issue, preserving engine and selected-path preferences and issuing no model request.
    notes: This negative integrity-boundary check uses real application handlers and inert files, not a real Codex process or a model call. It does not establish successful Codex execution and does not require or borrow a local Codex installation. The fixture layout currently targets macOS arm64; other platforms need separate fixtures.
  - id: models.engines.packaged-runtime
    title: Install an optional runtime and resume its real conversation in the emitted application
    verifies: [selection, external-setup, fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [packaged-app, halo-sdk]
    variants:
      engine: [anthropic, codex]
    preconditions:
      - A controlled emitted application starts on Halo in a fresh isolated HOME with a fixed OS-only PATH, no personal credentials and no optional runtime selected.
      - Explicit vendor artifact receipts supply unchanged official runtime bytes to a local mirror; the requested engine's process must execute on this host.
    steps:
      - Install the recommended release through the real inline settings panel and explicitly activate it.
      - Complete a turn with the real external process and local scripted model, restart the same packaged application and continue the original conversation.
    expected:
      - The actual application is packaged, the requested engine runs without fallback, and the same saved engine binding and prior context survive restarting.
    notes: This separately verifies emitted-application behavior, not source-build behavior. Only the model endpoint and artifact mirror are local fixtures; application handlers and runtime processes are real. It does not establish public network downloads, live models, installer signing or other platforms. An OS execution block remains uncovered rather than a passing skip.
  - id: models.engines.codex-runtime
    title: Run an explicitly selected external Codex with a local scripted model, MCP and native history resume
    verifies: [selection, fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-codex]
    preconditions:
      - An isolated profile uses the explicitly supplied fixed Codex 0.132.0 artifact, separate runtime state and a local scripted model without personal credentials.
    steps:
      - Complete a turn through the real external process and application MCP bridge, restart the isolated application, and continue the original conversation using its saved native history.
    expected:
      - The requested and actual engine remain Codex with no fallback. A real MCP tool completes, its result reaches the scripted model, and the resumed conversation retains history without replaying the earlier tool action.
    notes: This obligation requires real process execution and is blocked when the fixed artifact cannot execute on the host. It does not establish live providers, authenticated accounts, image input, permission approval, stopping a running turn, live steering or compatibility with other Codex versions. Those require separate evidence.
  - id: models.engines.cc-task-tracking
    title:
      en: Keep the task checklist when using a non-Claude model on Claude Code
      zh: Claude Code 使用非 Claude 模型时仍可使用待办清单
    verifies: [task-tracking]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    variants:
      model: [deepseek-v4.1-flash, gpt-6-astra]
      permission: [allowed, disabled]
    preconditions:
      - An isolated application selects an external Claude Code installation and a local scripted OpenAI-compatible model account.
    steps:
      - Start a conversation with the checklist tool allowed or explicitly disabled.
      - If allowed, discover the checklist tool when deferred, write a completed task and reopen the conversation.
    expected:
      - When allowed, the model receives TodoWrite's parameter schema, the actual tool succeeds, and the saved conversation displays the task checklist after reopening.
      - When explicitly disabled, neither TodoWrite nor the replacement Task tools are advertised; no checklist is executed.
    notes: The real external runtime and the application's model router execute against a local scripted endpoint. This does not establish live provider compatibility or coverage of every external Claude Code version.
  - id: models.engines.global-selection
    title:
      en: Apply a default engine choice to new conversations
      zh: 将默认引擎选择应用到新对话
    verifies:
      - selection
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated application starts on Halo, and both Halo and Claude Code are available on the host.
        zh: 隔离应用以 Halo 启动，主机上 Halo 与 Claude Code 两个引擎均可用。
    steps:
      - en: Complete a turn in one conversation, choose Claude Code as the default engine in Settings without restarting, then create a new conversation and complete a turn in both.
        zh: 在一个对话中完成一轮，在设置中不重启直接选择 Claude Code 为默认引擎，然后新建对话并在两个对话中各完成一轮。
    expected:
      - en: The new conversation stores and runs on Claude Code; the earlier conversation keeps and runs on Halo; engine reports match with no fallback.
        zh: 新对话保存并运行于 Claude Code，原对话保持并运行于 Halo；引擎报告一致且无回退。
    notes:
      en: The earlier restart-based check described an engine model that no longer exists and was removed. Claude Code is an optional external installation, so this case needs one on the host.
      zh: 此前基于重启的检查描述的引擎模型已不存在，已移除。Claude Code 是可选的外部安装，本例需要主机上已安装。
  - id: models.engines.unavailable
    title:
      en: Explain fallback from a missing engine
      zh: 说明缺失引擎的回退
    verifies:
      - fallback
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: Use isolated application data and supported installed engines.
        zh: 使用隔离应用数据及受支持的已安装引擎。
    steps:
      - en: Start a disposable build configured for an absent engine with another supported engine installed.
        zh: 启动一个配置引擎缺失、但装有其他受支持引擎的可丢弃构建。
    expected:
      - en: The application remains usable without rewriting the saved preference. An explicit Claude Code choice reports its unavailable installation without selecting another engine; other engine fallback identifies the actual engine.
        zh: 应用仍可使用，不改写保存偏好。明确选择 Claude Code 时报告安装不可用，不自动切换引擎；其他引擎回退说明实际引擎。
  - id: models.engines.upgrade-space
    title: Continue a historical space conversation on Halo
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      history: [native, transcript]
    expected:
      - Without a recorded explicit CC choice or currently selected claude-cli delegated account, availability reports CC as unconfigured and never inspects saved runtime paths, including when engine options are opened. Explicit selection, installation and user-triggered discovery remain available.
    notes: Source-build startup observation delegates filesystem calls unchanged and records runtime candidate reads and discovery traversal. Synthetic historical ownership over a real saved Halo-compatible session does not establish historical external CC writer compatibility or packaged-app behavior.
  - id: models.engines.explicit-missing
    title: Preserve an explicitly selected missing Claude Code installation
    verifies: [fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.upgrade-person
    title: Continue historical digital-human chat on Halo
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.upgrade-automation
    title: Start an independent task on Halo after an ordinary upgrade
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
  - id: models.engines.explicit-installed
    title: Keep an explicitly selected external Claude Code installation
    verifies: [fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    notes: Requires a real external Claude Code process to finish one turn against the local scripted model, not a live model or delegated login. HOME, USERPROFILE and the custom SDK config are isolated; owner credentials must not be supplied. If the selected CLI requires login despite the scripted API-key route, record the prerequisite as blocked rather than borrowing an account or counting a skip as passed.
  - id: models.engines.upgrade-delegated
    title: Retain Claude Code for the currently selected historical delegated account
    verifies: [upgrade, fallback]
    platforms: [darwin]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    variants:
      runtime: [installed, missing]
    notes: Seeds the real persisted delegated-source shape and checks engine selection without logging in or sending a model request. The installed variant requires a real isolated external CC runtime; absence is blocked. This does not establish delegated login or successful authenticated inference. Only the currently selected claude-cli delegated source counts as active choice; other historical defaults still use Halo.
  - id: models.engines.reselect-automatic-installation
    title: Reuse the same automatically recorded installation after an explicit conversation or digital-human CC choice
    verifies: [upgrade, selection, fallback]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk, local-claude-code]
    variants:
      entry: [space-chat, digital-human, automation]
    preconditions:
      - A historical profile has an automatically saved valid CC path without selectionOrigin and an explicit conversation or digital-human CC override.
    steps:
      - Try a turn or run, read the setup explanation, open Settings > Advanced, and select the same listed installation without downloading another version. Retry the conversation or task.
    expected:
      - The initial attempt stays on CC and fails with an explanation to select an installation once in Settings; automation retains the reason in its failed-run record. No automatic runtime check or fallback occurs.
      - The same installation is selectable. Explicit selection checks it, records user intent, and makes CC available; the next turn or run uses CC while history and the override remain intact.
    notes: Three executable bindings use the real installation selector and Advanced engine controls, persist user selection, and require an external Claude Code process to complete against a local scripted endpoint without fallback. Missing HALO_ACCEPTANCE_CLAUDE_CLI is blocked; no owner credentials or delegated login may be used. Binding and discovery alone are not evidence that these journeys passed.
  - id: models.engines.ordinary-upgrade
    title:
      en: Continue old conversations without discovering external runtimes
      zh: 不发现外部运行时即可继续旧对话
    verifies: [upgrade]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements: [halo-sdk]
    variants:
      entry: [space-chat, digital-human, im, automation-followup]
    preconditions:
      - en: An isolated profile has historical Claude Code defaults, paths and automatic bindings without recorded user selection, and synthetic saved history.
        zh: 隔离资料包含没有主动选择记录的旧 Claude Code 默认值、路径和自动绑定，以及合成历史。
    steps:
      - en: Start the app and continue the old conversation. Repeat with missing native history and then with neither recovery source available.
        zh: 启动应用并继续旧对话；分别测试原生历史缺失，以及两个恢复来源都不可用。
    expected:
      - en: Startup and continuation discover no external installation and perform no bulk rewrite. Compatible history reaches Halo without a migration notice or tool replay. Bounded fallback is disclosed; unrecoverable history remains intact and the turn fails. Conversation rows have no historical engine badge.
        zh: 启动与续聊不发现外部安装、不批量改写。兼容历史进入 Halo，不显示迁移提示、不重放工具。有损回退如实说明；不可恢复时历史保留且本轮失败。对话列表不显示历史引擎标签。
