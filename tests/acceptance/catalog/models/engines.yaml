version: 1
id: models.engines
module: models
title:
  en: Select an installed application engine
  zh: 选择已安装的应用执行引擎
story:
  en: I can choose which engine new conversations start on, see that existing conversations keep theirs, and recognize fallback when a configured engine is missing.
  zh: 我能选择新对话使用的引擎，看到已有对话保持原引擎，并识别配置引擎缺失时的回退。
basis: documented
references:
  - src/main/services/agent/resolved-sdk.ts
  - src/main/services/agent/engine-availability.ts
  - src/renderer/components/settings/AdvancedSection.tsx
promises:
  selection:
    en: The default engine for new conversations changes without restarting the application, and each existing conversation keeps the engine it runs on until it is moved explicitly.
    zh: 新对话使用的默认引擎无需重启应用即可切换，已有对话保持其所用引擎，直到被明确迁移。
  fallback:
    en: A missing configured engine is distinguished from the engine actually running, and its saved choice is retained.
    zh: 配置引擎缺失时，显示实际运行引擎与回退情况，并保留原配置选择。
scenarios:
  - id: models.engines.global-selection
    title:
      en: Apply a default engine choice to new conversations
      zh: 将默认引擎选择应用到新对话
    verifies:
      - selection
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    requirements:
      - halo-sdk
    preconditions:
      - en: An isolated application starts on Halo, and both Halo and Claude Code are available on the host.
        zh: 隔离应用以 Halo 启动，主机上 Halo 与 Claude Code 两个引擎均可用。
    steps:
      - en: Complete a turn in one conversation, choose Claude Code as the default engine in Settings without restarting, then create a new conversation and complete a turn in both.
        zh: 在一个对话中完成一轮，在设置中不重启直接选择 Claude Code 为默认引擎，然后新建对话并在两个对话中各完成一轮。
    expected:
      - en: The new conversation stores and runs on Claude Code; the earlier conversation keeps and runs on Halo; engine reports match with no fallback.
        zh: 新对话保存并运行于 Claude Code，原对话保持并运行于 Halo；引擎报告一致且无回退。
    notes:
      en: The earlier restart-based check described an engine model that no longer exists and was removed. Claude Code is an optional external installation, so this case needs one on the host.
      zh: 此前基于重启的检查描述的引擎模型已不存在，已移除。Claude Code 是可选的外部安装，本例需要主机上已安装。
  - id: models.engines.unavailable
    title:
      en: Explain fallback from a missing engine
      zh: 说明缺失引擎的回退
    verifies:
      - fallback
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: Use isolated application data and supported installed engines.
        zh: 使用隔离应用数据及受支持的已安装引擎。
    steps:
      - en: Start a disposable build configured for an absent engine with another supported engine installed.
        zh: 启动一个配置引擎缺失、但装有其他受支持引擎的可丢弃构建。
    expected:
      - en: The application remains usable and identifies both the unavailable choice and actual fallback without rewriting the saved preference.
        zh: 应用仍可使用，说明不可用选择与实际回退，不改写保存偏好。
