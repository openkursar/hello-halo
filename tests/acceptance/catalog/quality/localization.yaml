version: 1
id: quality.localization
module: quality
title:
  en: Understand user-visible text
  zh: 理解用户可见文案
story:
  en: I can read the product in my chosen language without raw implementation labels leaking into ordinary workflows.
  zh: 我能用选择的语言理解产品，常规流程不泄漏原始实现标签。
basis: documented
references:
  - .agents/skills/halo-dev/quick.md
  - src/renderer/i18n/index.ts
promises:
  language:
    en: User-facing labels and errors follow the chosen supported language.
    zh: 用户可见标签及错误遵循选定支持语言。
  content:
    en: Language changes preserve user-authored names and content.
    zh: 切换语言保留用户自定名称和内容。
scenarios:
  - id: quality.localization.switch
    title:
      en: Switch between English and Chinese during work
      zh: 工作时切换中英文
    verifies:
      - language
      - content
    platforms:
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: ui
    mode: none
    automation: planned
    preconditions:
      - en: Representative user-authored names include Chinese, emoji and long text.
        zh: 代表性自定名称包含中文、表情及长文字。
    steps:
      - en: Switch language while opening a main surface and a failed-operation state.
        zh: 切换语言并打开主要页面及操作失败状态。
    expected:
      - en: System text is translated, user content stays intact and no untranslated key is shown.
        zh: 系统文案翻译，用户内容完整，不显示未翻译键。
    variants:
      surface:
        - chat
        - people
        - team-task
        - settings
        - store
        - knowledge
