version: 1
id: changes.review
module: changes
title:
  en: Ask AI to review a precise snapshot
  zh: 让 AI 审阅明确的修改快照
story:
  en: I can request a quick or team review and return to its findings while continuing other work.
  zh: 我能请求快速或团队审阅，并在继续其他工作时回看结果。
basis: documented
references:
  - src/main/services/code-review/DESIGN.md
  - src/main/services/code-review/start-review.ts
  - tests/e2e/specs/acceptance-code-review.spec.ts
promises:
  snapshot:
    en: The review describes the selected repository and captured comparison scope.
    zh: 审阅针对选定仓库和捕获的比较范围。
  conversation:
    en: Review progress and findings live in a resumable conversation that can be opened or stopped.
    zh: 审阅进度和结论保存在可打开、停止及继续的对话。
scenarios:
  - id: changes.review.quick
    title:
      en: Start and revisit a quick review
      zh: 发起并回看快速审阅
    verifies:
      - snapshot
      - conversation
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: A fixture repository has a known change.
        zh: 测试仓库有已知修改。
    steps:
      - en: Choose quick review, keep browsing, then open its conversation.
        zh: 选择快速审阅，继续浏览后打开审阅对话。
    expected:
      - en: The review names the captured change and the conversation retains its result.
        zh: 审阅针对捕获的修改，对话保留结果。
    requirements:
      - halo-sdk
  - id: changes.review.team
    title:
      en: Distinguish complete, stopped and incomplete team reviews
      zh: 区分完整、已停止和不完整的团队审阅
    verifies:
      - snapshot
      - conversation
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: Team collaboration is available for a fixture review.
        zh: 测试审阅可使用团队协作。
    steps:
      - en: Start a team review through the changes panel. Three independent collaborators read the real source and receive follow-up work through their returned handles.
        zh: 从修改面板发起团队审阅。三位独立协作者读取真实源码，后续工作通过返回的句柄投递。
      - en: In the stop variant, stop while the source is idle and reviewers are working, then restart. In other variants, produce a complete or partial report.
        zh: 停止变体在源对话空闲、评审者工作时停止，然后重启；其他变体生成完整或部分报告。
    expected:
      - en: The selected snapshot reaches every reviewer. A complete report is shown while collaboration stays open; partial reports are incomplete. A requested stop survives restart and cancelled results never wake the source.
        zh: 每位评审者收到所选快照。完整报告显示时协作仍可保留；部分报告显示不完整。停止请求在重启后保留，取消的结果不会唤醒源对话。
    variants:
      outcome:
        - complete
        - stopped
        - incomplete
    requirements:
      - halo-sdk
    notes:
      en: Scripted replies verify execution, routing and state, not review quality. All members are local in this scenario; a stop label does not prove offline peers have finished cancelling.
      zh: 脚本回复验证执行、路由与状态，不评估审阅质量。本例成员均在本地，停止标签不证明离线节点已完成取消。
