version: 1
id: changes.inspect
module: changes
title:
  en: Understand the current code changes
  zh: 理解当前代码变更
story:
  en: I can see what changed and choose what comparison I am looking at.
  zh: 我能看到改了什么，并选择正在比较的范围。
basis: documented
references:
  - src/main/services/git/DESIGN.md
  - tests/e2e/specs/changes-view.spec.ts
  - tests/e2e/specs/changes-repositories.spec.ts
promises:
  scopes:
    en: The change list and diff agree with the chosen comparison scope and repository.
    zh: 变更列表与差异匹配选定比较范围及仓库。
  large:
    en: Large diffs remain navigable with explicit loading limits.
    zh: 大差异仍可导航，并明确加载限制。
  read:
    en: Opening a diff does not execute repository-provided programs as an unintended side effect.
    zh: 打开差异不会意外执行仓库自带程序。
  readable:
    en: Diff text and navigation remain readable in supported layouts and themes.
    zh: 差异文字及导航在支持的布局和主题下保持可读。
  reply:
    en: A reply’s recorded edits open read-only and remain distinct from current staging operations.
    zh: 某轮回复记录的编辑以只读方式打开，与当前暂存操作区分。
  repository-records:
    en: Verified file discoveries, selected shallow repositories and explicitly opened paths survive application restart. Removing an entry persistently suppresses both shallow and opened-file discovery until I explicitly open that repository again; none of these actions modify project files or Git metadata.
    zh: 已验证的文件发现、选中过的浅层仓库和主动打开的路径在应用重启后保留。移除记录会持久抑制浅扫描和打开文件时的自动发现，直到我再次主动打开该仓库；这些操作均不修改项目文件或 Git 元数据。
  repository-selection:
    en: The repository picker lists known paths without checking every repository. Only the selected repository is validated and loaded, so a slow unrelated path does not block my current changes. A failed selection stays selected and is marked unavailable; I can switch to a healthy repository, retry or remove the entry.
    zh: 仓库选择器只列出已知路径，不逐个检查仓库。仅校验和加载选中的仓库，慢的无关路径不阻塞当前变更。选择失败后保留选择并标记不可用，我仍能切换到健康仓库、重试或移除记录。
  repository-picker:
    en: Opening or canceling the picker leaves my selection, remembered paths and project files unchanged and does not recursively discover repositories. A parent folder or a repository outside the space is rejected without changing my current repository.
    zh: 打开或取消选择器不改变当前选择、记住的路径或项目文件，也不递归发现仓库。普通父目录或空间外仓库会被拒绝，且不改变当前仓库。
scenarios:
  - id: changes.inspect.opened-file-repository
    title:
      en: Discover the nearest repository from an opened file
      zh: 从已打开文件发现最近的仓库
    verifies: [scopes]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    steps:
      - en: With the outer repository already listed, open a file inside an ignored third-level independent repository, then return to Changes.
        zh: 外层仓库已经列出时，打开被忽略的三级独立仓库内的文件，然后返回变更。
    expected:
      - en: The repository picker includes the deep repository; selecting it shows its own changes rather than the outer repository's.
        zh: 仓库选择器包含深层仓库，选择后展示其自身修改而非外层修改。
  - id: changes.inspect.deep-repositories
    title:
      en: Explicitly open and remember a deep repository
      zh: 主动打开并记住深层仓库
    verifies: [scopes, repository-records]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A space contains an ignored independent repository three directories deep and a second unopened deep repository.
        zh: 空间包含位于三级目录、被外层忽略的独立仓库，以及另一个尚未打开的深层仓库。
    steps:
      - en: Use Open repository to choose the deep repository folder itself, then restart the application using the same isolated profile.
        zh: 用主动打开仓库选择该深层仓库自身目录，然后使用同一隔离配置重启应用。
      - en: Without opening a file in that repository, select its remembered path and inspect its changes.
        zh: 不打开该仓库内的文件，选择记住的路径并查看其变更。
      - en: Remove the selected entry, then restart the application again.
        zh: 移除选中记录，然后再次重启应用。
    expected:
      - en: The explicit path is remembered across restart and selects only that repository's changes; the unopened deep repository is not added.
        zh: 主动打开的路径在重启后保留，选中后仅展示该仓库的变更；尚未打开的深层仓库不会加入列表。
      - en: Removal returns to the healthy outer repository and remains in effect after restart without changing project files or Git metadata.
        zh: 移除后回到健康的外层仓库，重启后记录仍不恢复，项目文件和 Git 元数据均不变。
  - id: changes.inspect.automatic-repository-records
    title:
      en: Remember automatic discoveries and keep removals dismissed until explicit reopening
      zh: 保存自动发现，并在主动重开前持续抑制已移除仓库
    verifies: [scopes, repository-records]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    variants:
      discovery: [opened-file, shallow-child]
    preconditions:
      - en: An isolated space contains an ignored independent repository reached either by opening a file three directories deep or by shallow discovery of a direct child, plus another unopened deep repository.
        zh: 隔离空间包含被忽略的独立仓库，分别通过打开三级目录内文件或浅扫描直接子目录发现；另有一个尚未打开的深层仓库。
    steps:
      - en: Trigger the selected automatic discovery route and select the resulting repository without using Open repository.
        zh: 触发指定自动发现入口并选择发现的仓库，不使用主动打开仓库。
      - en: Close all canvas tabs and restart both application processes with the same profile; inspect the known path list before opening Changes or any file from that repository.
        zh: 关闭所有画布标签，使用同一配置重启主进程和渲染进程；在打开变更或该仓库内任何文件前检查已知路径列表。
      - en: Select and remove the remembered entry, open and reactivate its file, and request shallow discovery.
        zh: 选择并移除记住的记录，打开并再次激活其文件，同时请求浅扫描。
      - en: Close the canvas and restart again; check both discovery routes, then explicitly open the repository folder.
        zh: 关闭画布并再次重启，检查两种发现入口，然后主动打开该仓库目录。
    expected:
      - en: Automatic discovery is remembered across restart without reopening its file or relying on a fresh shallow scan; its own diff stays separate from the outer repository.
        zh: 自动发现会持久保存，重启后无需重开文件或依赖新一轮浅扫描便仍在列表中；其差异与外层仓库分离。
      - en: Removal suppresses opened-file and shallow discovery in the current process and after the second restart; the other unopened deep repository stays absent.
        zh: 移除会在当前进程及第二次重启后同时抑制打开文件和浅扫描发现；另一个尚未打开的深层仓库始终不在列表中。
      - en: Only explicit Open repository restores the remembered entry and its own changes, without changing project files, ignored or untracked content, or Git metadata.
        zh: 仅主动打开仓库恢复记住的记录及其自身变更，项目文件、被忽略或未跟踪内容及 Git 元数据均不变。
  - id: changes.inspect.repository-boundary
    title:
      en: Reject invalid repository folders without losing the current selection
      zh: 拒绝无效仓库目录且不丢失当前选择
    verifies: [scopes, repository-picker]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    variants:
      selection: [parent-folder, outside-repository]
    preconditions:
      - en: A healthy deep repository is selected; an ordinary parent folder and an independent repository outside the space are available as controlled picker results.
        zh: 当前选中健康的深层仓库；测试选择框可返回普通父目录或空间外独立仓库。
    steps:
      - en: Choose the invalid folder with Open repository and dismiss the error.
        zh: 使用主动打开仓库选择无效目录，然后关闭错误提示。
    expected:
      - en: A clear error explains that the repository folder must be inside the space; the selected repository, its diff and remembered paths remain unchanged.
        zh: 清晰错误说明必须选择空间内的仓库目录；当前仓库、差异及记住的路径保持不变。
      - en: Neither the project nor the rejected folder has any file or Git metadata changed.
        zh: 项目及被拒绝目录内的文件和 Git 元数据均未改变。
  - id: changes.inspect.repository-unavailable
    title:
      en: Validate a remembered path on selection and recover without losing repository access
      zh: 选择时校验记住的路径，失败后仍能访问其他仓库并恢复
    verifies: [scopes, repository-records, repository-selection]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A remembered deep repository is moved outside the space while the application is closed, leaving the outer repository healthy.
        zh: 应用关闭时将记住的深层仓库移到空间外，外层仓库保持健康。
    steps:
      - en: Restart the application, load the outer repository's changes and open the repository picker.
        zh: 重启应用，加载外层仓库变更并打开仓库选择器。
      - en: Select the missing remembered path, inspect its failed state, then switch back to the healthy repository.
        zh: 选择已缺失的记住路径，检查失败状态，再切回健康仓库。
      - en: Select the failed entry again, restore its directory and choose Try again.
        zh: 再次选择失败记录，恢复目录并点击重试。
      - en: Switch away, move the directory again, select it to fail and remove its entry; restart once more.
        zh: 切换到其他仓库，再次移走目录，选择使其失败并移除记录，然后再次重启。
    expected:
      - en: The missing path is initially listed and selectable without a precomputed unavailable label, and the healthy repository loads normally.
        zh: 缺失路径起初仍按路径显示且可选择，不预先标记不可用；健康仓库正常加载。
      - en: Only its failed selected load marks the entry unavailable; selection is retained, no stale diff is shown, and switching to a healthy repository remains possible.
        zh: 仅在选择加载失败后标记该记录不可用；保留选择且不展示旧差异，仍可切回健康仓库。
      - en: Retry after directory restoration loads its own changes and clears the unavailable state; removal remains possible after another failure and persists across restart.
        zh: 恢复目录后重试可加载自身变更并清除不可用状态；再次失败后仍能移除记录，且重启后不恢复。
      - en: Apart from the controlled directory moves, no project files or Git metadata are changed or deleted.
        zh: 除测试控制的目录移动外，项目文件和 Git 元数据均未被修改或删除。
  - id: changes.inspect.repository-picker-cancel
    title:
      en: Open and cancel repository pickers without changing the project
      zh: 打开及取消仓库选择器不改变项目
    verifies: [scopes, repository-picker]
    platforms: [darwin, win32, linux]
    profiles: [fast, regression]
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A healthy remembered deep repository is selected and another deep repository has never been opened.
        zh: 当前选中健康且已记住的深层仓库，另一个深层仓库从未打开。
    steps:
      - en: Open the repository menu and close it with Escape, then open the native folder picker and cancel it.
        zh: 打开仓库菜单并按 Escape 关闭，再打开系统目录选择框并取消。
    expected:
      - en: The current repository, diff and remembered paths remain unchanged; the unopened deep repository is not added and no error is shown.
        zh: 当前仓库、差异及记住的路径均不变；尚未打开的深层仓库不加入列表，也不显示错误。
      - en: Escape restores focus to the picker, and project files and Git metadata remain byte-for-byte unchanged with their modes and file modification times preserved.
        zh: Escape 将焦点还给选择器；项目文件及 Git 元数据逐字节不变，权限及文件修改时间保持不变。
    notes:
      en: The executable test checks the discovery result and filesystem snapshot; it does not instrument filesystem traversal or prove the absence of internal reads.
      zh: 可执行测试检查发现结果和文件系统快照，不监测目录遍历，也不证明内部完全没有读取。
  - id: changes.inspect.repository-unrelated-slow-path
    title:
      en: A slow unselected repository does not delay current changes
      zh: 慢的未选中仓库不延迟当前变更
    verifies: [repository-selection]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: The space has one healthy selected repository and a remembered unselected repository on a controllably slow filesystem.
        zh: 空间有一个健康的选中仓库，以及位于可控慢文件系统上的记住但未选中仓库。
    steps:
      - en: Hold access to the unrelated path, then open Changes and its repository picker.
        zh: 阻塞无关路径的访问，然后打开变更及仓库选择器。
    expected:
      - en: The known paths and selected repository's changes become usable while the unrelated path remains blocked; only selecting that path initiates its validation and load.
        zh: 无关路径仍阻塞时，已知路径及选中仓库变更即可使用；仅选择该路径才开始校验和加载。
    notes:
      en: Missing-path recovery does not establish slow-filesystem isolation; this requires an independent real-application binding without replacing application handlers.
      zh: 缺失路径恢复不证明慢文件系统隔离；本场景需独立的真实应用绑定，不可替换应用处理器。
  - id: changes.inspect.scopes
    title:
      en: Switch comparison scopes
      zh: 切换比较范围
    verifies:
      - scopes
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - fast
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: A disposable repository has staged, unstaged and generated-file changes.
        zh: 测试仓库含已暂存、未暂存及生成文件变更。
    steps:
      - en: Open changes and switch between supported scopes.
        zh: 打开变更并切换支持的范围。
    expected:
      - en: Rows, status and file diffs match the selected scope.
        zh: 列表、状态与差异符合所选范围。
  - id: changes.inspect.large
    title:
      en: Browse a large diff without losing selection
      zh: 浏览大差异且不丢选择
    verifies:
      - large
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: A fixture repository exceeds the viewer’s text budget.
        zh: 测试仓库超过查看器文本预算。
    steps:
      - en: Load one file, scroll, filter the list and switch away and back.
        zh: 加载单文件、滚动、筛选，再切走并返回。
    expected:
      - en: Loading is bounded and the selected file and supported scroll position persist.
        zh: 加载受控，选定文件及支持的滚动位置保留。
  - id: changes.inspect.safe-read
    title:
      en: Inspect a repository with executable local filters
      zh: 检查含可执行本地过滤器的仓库
    verifies:
      - read
    platforms: *a1
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: planned
    preconditions:
      - en: A fixture repository configures a harmless marker-writing local filter.
        zh: 测试仓库配置会写标记的无害本地过滤器。
    steps:
      - en: Open and refresh status and diffs without choosing a write operation.
        zh: 只打开刷新状态和差异，不选择写操作。
    expected:
      - en: The marker program is not run by read-only inspection.
        zh: 只读检查未运行该标记程序。
  - id: changes.inspect.large-selection
    title:
      en: Navigate a large diff one file at a time
      zh: 逐文件导航大差异
    verifies:
      - large
    platforms: &a2
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Filter and select a file, move to its next file and switch overview tabs.
        zh: 筛选选择文件，移到下一文件并切换概览标签。
    expected:
      - en: Exactly one large-diff file is mounted and the selected file returns after tab switching.
        zh: 大差异一次只挂载一文件，切换标签后恢复选择。
  - id: changes.inspect.reading-anchor
    title:
      en: Keep a diff reading position while filtering
      zh: 筛选时保留差异阅读位置
    verifies:
      - large
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Scroll a large diff, change its file filter and refresh.
        zh: 滚动大差异，改变文件筛选并刷新。
    expected:
      - en: The selected file and reading offset remain stable.
        zh: 选定文件及阅读位置保持稳定。
  - id: changes.inspect.narrow-selection
    title:
      en: Choose a diff file from a narrow drawer
      zh: 从窄屏抽屉选择差异文件
    verifies:
      - large
      - readable
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Open the narrow file drawer and select a different large-diff file.
        zh: 打开窄屏文件抽屉，选择另一大差异文件。
    expected:
      - en: The drawer closes, the selected diff appears and focus moves to that file’s control.
        zh: 抽屉关闭，选定差异出现，焦点移到该文件控件。
  - id: changes.inspect.contrast-layout
    title:
      en: Read split and inline diffs in both themes
      zh: 在两种主题阅读并排及行内差异
    verifies:
      - readable
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Switch diff layouts and themes, inspect rendered contrast, then select a file from the narrow drawer.
        zh: 切换差异布局及主题，检查渲染对比度，再从窄屏抽屉选文件。
    expected:
      - en: Text contrast meets the asserted threshold and controls remain within the viewport.
        zh: 文字对比度达到断言阈值，控件保留在视口内。
  - id: changes.inspect.reply-pagination
    title:
      en: Navigate many edits from one reply
      zh: 导航一轮回复中的大量编辑
    verifies:
      - reply
      - large
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Open a reply with many edit fragments, page and keyboard-navigate them, switch tabs and return.
        zh: 打开含大量编辑片段的回复，翻页及键盘导航，切换标签后返回。
    expected:
      - en: Fragment pages and selected file/position are retained while editor counts stay bounded.
        zh: 片段页、文件及位置保留，编辑器数量受控。
  - id: changes.inspect.reply-readonly
    title:
      en: Read a reply’s edits without staging controls
      zh: 只读查看回复编辑且无暂存控件
    verifies:
      - reply
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Click View changes on a seeded reply.
        zh: 点击预置回复中的查看变更。
    expected:
      - en: The reply’s files appear with read-only identity and no stage or commit controls.
        zh: 回复文件以只读身份显示，没有暂存或提交控件。
  - id: changes.inspect.chunk-navigation
    title:
      en: Move between changes with keyboard shortcuts
      zh: 使用快捷键在修改间跳转
    verifies:
      - scopes
      - readable
    platforms: &a3
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Select a file, move to the next change across a file boundary and then back.
        zh: 选择文件，跳到跨文件的下一处修改再返回。
    expected:
      - en: The intended changed lines are brought into view in both directions.
        zh: 双向导航均把预期修改行带到可见位置。
  - id: changes.inspect.file-order
    title:
      en: Keep diff order consistent with the file list
      zh: 让差异顺序与文件列表一致
    verifies:
      - scopes
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Switch tree/list mode and navigate numbered files in a large diff.
        zh: 切换树形和列表模式，在大差异中导航带编号文件。
    expected:
      - en: Diff order matches the list and natural filename ordering is preserved.
        zh: 差异顺序匹配列表，并保持自然文件名排序。
  - id: changes.inspect.scope-budget
    title:
      en: Reconsider loading limits after changing scope
      zh: 改变比较范围后重新判断加载限制
    verifies:
      - scopes
      - large
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Switch between a large uncommitted scope and a small staged scope.
        zh: 在大范围未提交变更与小范围已暂存变更之间切换。
    expected:
      - en: The current scope determines the loading mode, not the size of the previous scope.
        zh: 加载方式由当前范围决定，不沿用上个范围大小。
  - id: changes.inspect.explicit-load
    title:
      en: Keep the file explicitly requested for loading
      zh: 保留用户明确要求加载的文件
    verifies:
      - large
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Reveal generated files and explicitly load a large file’s diff.
        zh: 显示生成文件并明确加载大文件差异。
    expected:
      - en: The requested file becomes the selected bounded view instead of disappearing when the limit is reached.
        zh: 到达限制时指定文件成为有界选定视图，不会消失。
  - id: changes.inspect.deep-paths
    title:
      en: Read and select deeply nested files
      zh: 阅读并选择深层文件
    verifies:
      - readable
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Open a deep file tree at its narrowest supported panel size.
        zh: 以最窄支持面板打开深层文件树。
    expected:
      - en: Deep names and their selection controls remain visible and usable.
        zh: 深层名称及选择控件仍可见可用。
  - id: changes.inspect.tree-folders
    title:
      en: Expand and collapse nested folders
      zh: 展开及收起嵌套目录
    verifies:
      - scopes
      - readable
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Collapse a parent, filter a nested path and expand it with the keyboard.
        zh: 折叠父目录，筛选嵌套路径并用键盘展开。
    expected:
      - en: Each folder appears once and descendants follow the intended collapse and keyboard focus state.
        zh: 各目录只出现一次，子项遵循折叠及键盘焦点状态。
  - id: changes.inspect.panel-width
    title:
      en: Resize and cancel resizing the file list
      zh: 调整及取消调整文件列表宽度
    verifies:
      - readable
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
      - en: Resize with pointer and keyboard, cancel an in-progress drag, reset and resize the viewport.
        zh: 用指针及键盘调整宽度，取消进行中拖动，重置并改变视口。
    expected:
      - en: Accepted width persists; cancellation restores the saved width and narrowing does not overwrite the preference.
        zh: 接受的宽度保留，取消恢复保存宽度，窄屏不覆盖偏好。
  - id: changes.inspect.overview-folder
    title:
      en: Inspect a folder from the change overview
      zh: 从变更概览查看目录
    verifies:
      - scopes
    platforms: *a3
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use isolated representative data for the selected product surface.
        zh: 为选定功能使用隔离的代表性数据。
    steps:
