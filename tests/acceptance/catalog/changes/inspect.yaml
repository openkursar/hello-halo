        zh: 从概览进入目录并用 Escape 返回。
    expected:
      - en: The folder detail is scoped correctly and Escape returns within the view without closing the canvas.
        zh: 目录详情范围正确，Escape 在视图内返回而不关闭画布。
  - id: changes.inspect.page-controls
    title:
      en: Keep comparison navigation reachable
      zh: 保持比较导航可达
    verifies:
