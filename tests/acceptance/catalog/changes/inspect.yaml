    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Open a reply with many edit fragments, page and keyboard-navigate them, switch tabs and return.
        zh: 打开含大量编辑片段的回复，翻页及键盘导航，切换标签后返回。
    expected:
      - en: Fragment pages and selected file/position are retained while editor counts stay bounded.
        zh: 片段页、文件及位置保留，编辑器数量受控。
  - id: changes.inspect.reply-readonly
    title:
      en: Read a reply’s edits without staging controls
      zh: 只读查看回复编辑且无暂存控件
    verifies:
      - reply
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Prepare an isolated workspace with the records and failure conditions described by this scenario.
        zh: 在隔离空间准备本场景所述记录及失败条件。
    steps:
      - en: Click View changes on a seeded reply.
        zh: 点击预置回复中的查看变更。
    expected:
      - en: The reply’s files appear with read-only identity and no stage or commit controls.
        zh: 回复文件以只读身份显示，没有暂存或提交控件。
  - id: changes.inspect.chunk-navigation
