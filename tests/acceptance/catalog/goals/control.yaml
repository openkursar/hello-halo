version: 1
id: goals.control
module: goals
title:
  en: Keep work focused on a goal
  zh: 让任务围绕目标推进
story:
  en: I can state the objective and completion conditions, then see whether work is still pursuing them.
  zh: 我能设定目标和完成条件，知道 AI 是否仍在推进。
basis: observed
references:
  - src/shared/types/goal.ts
  - src/renderer/components/goal/GoalEditor.tsx
  - src/main/services/agent/goal/index.ts
  - tests/e2e/specs/acceptance-goals.spec.ts
promises:
  state:
    en: The objective, completion conditions and current state are shown together.
    zh: 目标、完成条件及当前状态一起展示。
  control:
    en: User changes reach the supported engine and completed or abandoned goals stop steering new work.
    zh: 用户修改会送达支持的引擎，完成或放弃的目标不再引导后续工作。
scenarios:
  - id: goals.control.set
    title:
      en: Set and revise a goal
      zh: 设置并修改目标
    verifies:
      - state
      - control
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    notes:
      en: A local scripted model calls a real command while the user edits the goal; the next model request and engine acknowledgement must contain the revised goal. This verifies delivery and state, not a model's judgement or context-compaction recovery.
      zh: 本地脚本模型调用真实命令，期间用户修改目标；下一次模型请求及引擎确认必须包含新版目标。验证传递与状态，不代表模型判断能力或上下文压缩后的恢复已验证。
    preconditions:
      - en: The current engine supports goals.
        zh: 当前引擎支持目标。
    steps:
      - en: Set an objective and completion conditions, then revise them during a tool call.
        zh: 设置目标及完成条件，并在工具执行时修改。
    expected:
      - en: The UI shows the latest goal and indicates when the model has received it.
        zh: 界面显示最新目标，并表明模型是否已收到。
  - id: goals.control.finish
    title:
      en: Complete, abandon or clear a goal
      zh: 完成、放弃或移除目标
    verifies:
      - state
      - control
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    variants:
      action:
        - complete
        - abandon
        - clear
    notes:
      en: Completion and abandonment use the real advertised Goal tool; clearing uses the UI confirmation while a command is running. A later ordinary message must finish without another open-goal model step. Paused goals and percentage progress are not supported states.
      zh: 完成和放弃通过真实公开的 Goal 工具执行；清除在命令运行中通过界面确认。之后的普通消息必须正常结束，不能因旧目标触发额外模型步骤。目标暂停与百分比进度不是当前支持的状态。
    preconditions:
      - en: A goal is active.
        zh: 当前有活动目标。
    steps:
      - en: Exercise supported completion, abandonment and clearing actions in separate conversations.
        zh: 在独立对话中分别执行支持的完成、放弃和移除操作。
    expected:
      - en: The resulting state is visible and the previous active goal no longer steers a later turn.
        zh: 结果状态可见，旧目标不再引导之后的对话。
