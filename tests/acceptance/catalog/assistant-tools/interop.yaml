version: 1
id: assistant-tools.interop
module: assistant-tools
title:
  en: Connect work across conversations
  zh: 连接多个对话的工作
story:
  en: I can ask the AI to consult or contact another permitted conversation without mixing identities.
  zh: 我能让 AI 查看或联系另一个获准对话，不混淆身份。
basis: documented
references:
  - src/main/services/conversation-interop/DESIGN.md
  - tests/e2e/specs/acceptance-conversation-interop.spec.ts
  - tests/e2e/specs/acceptance-conversation-quiet-end.spec.ts
promises:
  identity:
    en: Read and send operations resolve the intended permitted conversation and retain message provenance.
    zh: 读取和发送定位获准目标对话，并保留消息来源。
  delivery:
    en: Messages reaching compatible active work are delivered at the supported next-step boundary.
    zh: 到达权限兼容活动任务的消息在支持的下一步边界送达。
  quiet:
    en: When the AI has nothing to say to a message from another conversation, its turn ends quietly, with no error and no blank reply; an empty answer to a person's own message is still reported.
    zh: AI 对另一对话发来的消息无话可说时，这一轮安静结束，不报错也不留空白回复；人自己发的消息得到空回答时仍会提示。
scenarios:
  - id: assistant-tools.interop.send
    title:
      en: Send a message to another active conversation
      zh: 向另一活动对话发消息
    verifies:
      - identity
      - delivery
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: Two authorized conversations have distinct known identities.
        zh: 两个获准对话有不同已知身份。
    steps:
      - en: Ask A to send a marked message to B while B is running a controlled tool.
        zh: B 运行受控工具时，让 A 给 B 发送标记消息。
    expected:
      - en: B receives it at the next eligible step with A identified as the source.
        zh: B 在下一合适步骤收到消息，来源标记为 A。
    notes:
      en: Both conversations run the real application and engine with the same owner permissions. A native tool holds the recipient's current step; the next model input and stored/UI provenance are inspected. No external recipient or cross-permission delivery is exercised.
      zh: 两个对话使用同一所有者权限运行真实应用与引擎；以原生工具保持接收方当前步骤，检查下一次模型输入及保存和界面来源标记。不涉及外部接收者或跨权限投递。
  - id: assistant-tools.interop.opener
    title:
      en: See the source of a conversation message before its new reply finishes
      zh: 新回复结束前即可看到跨对话来件来源
    verifies: [identity, delivery]
    platforms: *a1
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      recipient: [visible, cached-background, unopened]
    preconditions:
      - en: An authorized sender and an idle recipient exist in an isolated workspace; the recipient is visible, previously opened but now in the background, or not yet opened.
        zh: 隔离空间中有获准发送方和空闲接收方；接收方当前可见、曾打开但已切到后台，或尚未打开。
    steps:
      - en: The sender sends a marked conversation message that opens a new recipient turn, whose real tool is held at a controlled boundary.
        zh: 发送方发送标记来件，开启接收方新一轮，并让真实工具停留在受控边界。
      - en: While that tool is still held, inspect the recipient or switch back to it, expand the source card and follow its source link; then release the tool, finish and reopen the conversation.
        zh: 工具仍被保持时查看或切回接收方，展开来源卡并点击来源链接；随后释放工具、完成并重开对话。
    expected:
      - en: Before the recipient finishes, a standalone source line shows the sender and summary without a box or relative time. It expands to the original message and opens the correct sender conversation.
        zh: 接收方尚未完成时，独立来件以无边框、无相对时间的一行显示发送方和摘要，可展开原始消息并打开正确发送方对话。
      - en: Completion and reopening keep exactly one attributed system record, with no extra user message or replayed model input; an unaddressed conversation is unchanged.
        zh: 完成和重开后仍只有一条带来源的系统记录，不多出用户消息或重放模型输入，未寻址对话保持不变。
    notes:
      en: Only the model endpoint is scripted; the actual conversation-send tool, storage, application events and UI run unchanged. Dark/light desktop and 390px captures are included for the visible-recipient variant. Other engines and remote WebSocket clients are not established by this scenario.
      zh: 仅替换模型端点；真实跨对话发送工具、存储、应用事件和界面均照常运行。当前可见变体含深浅色桌面和390px截图。本场景不证明其他引擎或远程WebSocket客户端行为。
  - id: assistant-tools.interop.read
    title:
      en: Read permitted history and reject an invalid target
      zh: 读取获准历史并拒绝无效目标
    verifies:
      - identity
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A known readable conversation, another workspace's private control and an invalid target are available in an isolated profile.
        zh: 隔离资料中有已知可读对话、另一空间的私有对照和无效目标。
    steps:
      - en: Read both through the tool interface.
        zh: 通过工具分别读取。
    expected:
      - en: The valid target returns its own history; invalid targeting is explicit and leaks no other history.
        zh: 有效目标返回自身历史，无效目标明确失败且不泄漏其他历史。
      - en: The conversation directory excludes the caller and other workspace, and reading leaves both stored histories unchanged.
        zh: 对话目录排除调用者及其他空间，读取不改变两份已保存历史。
  - id: assistant-tools.interop.quiet-end
    title:
      en: A message that needs no reply ends the recipient's turn quietly
      zh: 无需回复的来件让接收方安静结束这一轮
    verifies: [quiet]
    platforms: *a1
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - en: An authorized sender and an idle recipient that already answered a person exist in an isolated workspace.
        zh: 隔离空间中有获准发送方，以及已回答过人的空闲接收方。
    steps:
      - en: The sender sends a notice saying no reply is needed; the recipient's model finishes without text or a tool call.
        zh: 发送方发来写明无需回复的通知，接收方模型既不写字也不调用工具就结束。
      - en: The person then sends the recipient a message, and its model again finishes without anything.
        zh: 随后人给接收方发消息，模型同样什么也没写就结束。
    expected:
      - en: After the notice, the recipient shows the attributed message and nothing after it, with no error; reopening keeps it so, and its model was asked once.
        zh: 来件之后，接收方只显示带来源的消息，其后无回复、无报错；重开后依旧，接收方模型只被请求一次。
      - en: After the person's own message, the empty answer is reported as before.
        zh: 人自己发消息后，空回答仍照旧提示。
    notes:
      en: Only the model endpoint is scripted, behind the real OpenAI-compatible router, which repairs an empty reply with blank text as it does for GPT models. Digital-human chats do not accept a quiet end yet, so this covers space conversations only.
      zh: 仅替换模型端点，经过真实的 OpenAI 兼容转发层；它像对 GPT 模型那样用空白文字修补空回复。数字人对话尚未接受安静结束，本场景只覆盖空间对话。
