        zh: 保持宿主草稿焦点，用浏览按键工具提交网页表单。
    expected:
      - en: The form navigates to its destination while host text, selection and focus stay unchanged.
        zh: 表单导航到目标，宿主文字、选区与焦点不变。
    notes:
