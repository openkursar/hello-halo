version: 1
id: browser.work
module: browser
title:
  en: Inspect the page the AI is using
  zh: 查看 AI 正在使用的网页
story:
  en: I can watch a live page, interact with it and let the AI continue from the same state.
  zh: 我能查看实时网页并操作，再让 AI 从同一状态继续。
basis: documented
references:
  - src/main/services/ai-browser/DESIGN.md
  - src/main/services/browser-host/DESIGN.md
  - tests/e2e/specs/browser-view-reveal.spec.ts
  - tests/e2e/specs/browser-view-frame.spec.ts
  - tests/e2e/specs/browser-carrier-packaged.spec.ts
  - tests/e2e/specs/browser-carrier-server.spec.ts
promises:
  identity:
    en: Showing or hiding a page preserves its browser state instead of silently opening a different session.
    zh: 显示或隐藏页面保留原浏览状态，不悄悄开启另一会话。
  input:
    en: Supported typing, selection and trusted gestures affect the intended page or frame.
    zh: 输入、选中及可信手势作用于目标页面或框架。
  context:
    en: Automation browser pages remain isolated from unrelated interactive conversations.
    zh: 自动化浏览页面与无关交互对话保持隔离。
  capture:
    en: A requested screenshot contains the actual selected page surface rather than an empty or transparent substitute.
    zh: 请求截图包含所选页面的真实画面，而不是空白或透明替代。
scenarios:
  - id: browser.work.reveal
    title:
      en: Reveal and hide an active AI page
      zh: 显示和隐藏 AI 活动页面
    verifies:
      - identity
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    notes:
      en: A real space conversation uses the production browser tools to open owned local control and target pages. The user reveals, edits, scrolls, collapses and reopens the same guest; a later real model step receives the resulting tool read before deliberately navigating that guest. Only the model endpoint and local website are fixtures.
      zh: 真实空间对话通过生产浏览器工具打开自有本地对照页及目标页。用户显示、编辑、滚动、收起并重开同一网页进程；后续真实模型步骤先收到工具读取的用户状态，再明确导航该网页。仅模型端点及本地网站使用测试服务。
    preconditions:
      - en: An AI context has opened a controlled local page.
        zh: AI 上下文已打开受控本地网页。
    steps:
      - en: Enter a value, reveal it in the canvas, hide it and reveal again.
        zh: 输入值，在画布显示，隐藏后再显示。
    expected:
      - en: The same page retains its entered state and can continue navigation.
        zh: 同一页面保留输入状态并能继续导航。
  - id: browser.work.input
    title:
      en: Type and paste into the intended frame
      zh: 在目标框架中输入与粘贴
    verifies:
      - input
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
      - mac-clipboard
    notes:
      en: A real browser conversation owns the tested page. Native user input covers normal and same-origin iframe fields, selection, clipboard copy/paste and page-cancelled shortcuts; a later production browser key tool and tool read must preserve the independent composer and control page. Original clipboard formats are used only for restoration; all pasted data is fixture-owned. The registered mac-clipboard prerequisite checks the selected developer tools and compiles the public complete-format AppKit helper without running it or touching the clipboard. Missing tools, SDKs or a full-format backend on other platforms remain blocked, with platform obligations retained. File-picker, upload, download and cross-origin variants retain their separate obligations.
      zh: 真实浏览对话拥有待测页面。用户原生输入覆盖普通及同源 iframe 字段、选区、剪贴板复制粘贴和网页取消的快捷键；后续生产浏览按键工具与读取工具须保留独立聊天输入框及对照页。原剪贴板格式仅用于恢复，所有粘贴数据均由测试自己准备。已注册的 mac-clipboard 前置检查所选开发工具，并编译公开的完整格式 AppKit helper，不执行 helper 或触碰剪贴板。缺少工具、SDK 或其他平台的完整格式后端时明确阻塞，并保留平台义务。文件选择、上传、下载及跨源变体继续保留各自义务。
    preconditions:
      - en: A local fixture contains normal and iframe inputs.
        zh: 本地测试网页含普通和 iframe 输入框。
    steps:
      - en: Use native typing, keyboard shortcuts and paste, including a page-cancelled gesture.
        zh: 使用原生输入、快捷键及粘贴，包括网页取消的手势。
    expected:
      - en: The intended field changes and cancelled input does not leak into another field or host editor.
        zh: 目标字段改变，被取消输入不泄漏到其他字段或宿主编辑器。
  - id: browser.work.live-metadata
    title:
      en: Keep live page labels current without changing the viewed page
      zh: 活动网页标签保持更新而不改变查看页面
    verifies:
      - identity
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: One real browser conversation owns two controlled local pages, and the user has collapsed the target canvas with a focused chat draft.
        zh: 一段真实浏览对话拥有两个受控本地页面，用户已收起目标画布并聚焦聊天草稿。
    steps:
      - en: Observe both loaded page labels, then let the local website asynchronously change an inactive title and URL, change the active title and navigate the active page.
        zh: 查看两个页面加载后的标签，再由本地网站异步改变非活动页标题和 URL、活动页标题，并导航活动页。
      - en: Reopen through the conversation's live-view action and choose the target's current label in the live-session tray, then ask the AI to read it.
        zh: 从对话实时查看入口重开，再在活动会话托盘中按目标当前标签选择页面，并让 AI 读取。
    expected:
      - en: Live rows show their own current titles and reopen the current URLs while the target remains selected; metadata updates do not open the canvas, move focus, alter the draft or reassign page ownership.
        zh: 活动条目显示自身当前标题并重开当前 URL，目标选择不变；元数据更新不打开画布、不移动焦点、不改草稿或页面归属。
      - en: Reopening uses the same view and guest, control content stays intact, and the AI receives the actual navigated document state.
        zh: 重开使用原视图及网页进程，对照内容完整，AI 收到实际导航后的文档状态。
  - id: browser.work.isolation
    title:
      en: Keep browser contexts apart
      zh: 保持浏览上下文独立
    verifies:
      - context
    platforms: *a1
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: planned
    preconditions:
      - en: An automation and two interactive conversations each own test pages.
        zh: 自动化与两个交互对话分别拥有测试页面。
    steps:
      - en: List and operate pages from each context.
        zh: 从各上下文列出并操作页面。
    expected:
      - en: Only the context’s permitted pages are visible and operable.
        zh: 只能看到和操作该上下文获准页面。
  - id: browser.work.hide-show
    title:
      en: Retain page draft and scroll through hide/show
      zh: 隐藏显示时保留网页草稿及滚动
    verifies:
      - identity
    platforms: &a2
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: automated
    preconditions:
      - en: Use a local test website and isolated Electron data.
        zh: 使用本地测试网站及隔离 Electron 数据。
    steps:
      - en: Set a page draft and scroll position, then repeatedly hide and show through public browser APIs.
        zh: 设置网页草稿及滚动位置，通过公共浏览 API 反复隐藏和显示。
    expected:
      - en: The same page retains draft and scroll and continues to paint actual pixels.
        zh: 同一页面保留草稿与滚动，并持续绘制真实画面。
  - id: browser.work.canvas-navigation
    title:
      en: Keep a webpage while navigating the app
      zh: 应用导航时保留网页
    verifies:
      - identity
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use a local test website and isolated Electron data.
        zh: 使用本地测试网站及隔离 Electron 数据。
    steps:
      - en: Use real canvas tabs, collapse, settings navigation and fullscreen with a page draft.
        zh: 带网页草稿使用真实标签切换、折叠、设置导航及全屏。
    expected:
      - en: Page identity and draft survive those transitions until the user explicitly closes the page tab.
        zh: 页面身份及草稿保留，直到用户明确关闭该页面标签。
  - id: browser.work.composer-focus
    title:
      en: Keep typing while a hidden page is inspected
      zh: 隐藏网页被检查时继续输入
    verifies:
      - input
    platforms: *a2
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: automated
    preconditions:
      - en: Use a local test website and isolated Electron data.
        zh: 使用本地测试网站及隔离 Electron 数据。
    steps:
      - en: Focus a chat draft, inspect and capture a parked page, then continue typing.
        zh: 聚焦聊天草稿，检查截图隐藏网页，再继续输入。
    expected:
      - en: The composer keeps focus and its draft while the hidden page receives only its own change.
        zh: 聊天输入框保留焦点及草稿，隐藏网页仅接收自己的变更。
  - id: browser.work.packaged-frame
    title:
      en: Display a real browser page in the installed app
      zh: 在安装包中显示真实网页
    verifies:
      - identity
    platforms: *a2
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: automated
    preconditions:
      - en: Use a local test website and isolated Electron data.
        zh: 使用本地测试网站及隔离 Electron 数据。
    steps:
      - en: Launch the packaged app, show a controlled page, hide it and capture it.
        zh: 启动安装包，显示受控网页，隐藏后截图。
    expected:
      - en: The packaged runtime captures a real page surface while shown and parked.
        zh: 打包运行时在显示和隐藏状态均能获取真实页面画面。
    requirements:
      - packaged-app
  - id: browser.work.watch-takeover
    title:
      en: Watch, take over and return an AI page
      zh: 观看、接手并交还 AI 网页
    verifies:
      - identity
      - input
    platforms: *a2
    profiles:
      - regression
    evidence: integration
    mode: none
    automation: automated
    preconditions:
      - en: Use a local test website and isolated Electron data.
        zh: 使用本地测试网站及隔离 Electron 数据。
    steps:
      - en: Open through the selected browser context, let tools fill it, make user edits during reveal and continue tools while parked.
        zh: 从选定浏览上下文打开，用工具填写，显示时由用户编辑，再隐藏并继续工具操作。
    expected:
      - en: The same page retains both user and tool changes and the host input keeps its own focus.
        zh: 同一页面保留用户及工具变更，宿主输入保留自身焦点。
    variants:
      context:
        - main
        - human
    notes:
      en: Real browser/MCP production modules run in a dedicated Electron fixture; the full Halo conversation and model path are outside this evidence.
      zh: 真实浏览器及 MCP 生产模块运行于专用 Electron 测试壳；本证据不包含完整 Halo 对话及模型链路。
  - id: browser.work.unattended-reload
