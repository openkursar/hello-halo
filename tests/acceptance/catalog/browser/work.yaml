        zh: 分别通过原生和 AI 截图路径获取浅色、深色及明确背景色页面。
    expected:
      - en: Captured images remain opaque and match each page’s expected background.
        zh: 截图保持不透明，并匹配页面预期背景。
    notes:
      en: The dedicated browser fixture invokes real production tools without a model or the full chat path.
      zh: 专用浏览测试壳调用真实生产工具，不包含模型及完整聊天链路。
  - id: browser.work.tool-chain
