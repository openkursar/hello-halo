version: 1
id: capabilities.migrate
module: capabilities
title:
  en: Bring existing CLI resources into Halo
  zh: 把已有 CLI 资源迁入 Halo
story:
  en: I can copy existing skills or tool connections without losing either side’s configuration by accident.
  zh: 我能复制已有技能或工具连接，不意外丢失任一边配置。
basis: observed
references:
  - src/renderer/components/settings/CLIConfigSection.tsx
  - src/renderer/hooks/useMigration.ts
promises:
  preview:
    en: A scan shows existing resources and collision choices before migration.
    zh: 迁移前扫描显示已有资源及冲突处理选项。
  selected:
    en: Only selected resources are copied or overwritten according to each chosen action.
    zh: 只按各自所选操作复制或覆盖指定资源。
  directory:
    en: Sharing the CLI configuration requires the offered explicit warning; custom paths show the effective directory.
    zh: 共享 CLI 配置需明确警告确认，自定义路径显示实际目录。
scenarios:
  - id: capabilities.migrate.skills
    title:
      en: Migrate skills with a naming collision
      zh: 迁移名称冲突的技能
    verifies:
      - preview
      - selected
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: Isolated source and destination skill folders contain one colliding name.
        zh: 隔离源与目标技能目录有一个重名项。
    steps:
      - en: Scan, choose skip/overwrite/rename on separate fixtures and execute migration.
        zh: 扫描，在不同测试资料中选择跳过、覆盖或重命名并迁移。
    expected:
      - en: Each result follows its selected action and unrelated skills remain unchanged.
        zh: 结果符合所选操作，无关技能不变。
  - id: capabilities.migrate.mcp
    title:
      en: Import selected MCP definitions
      zh: 导入选定 MCP 配置
    verifies:
      - preview
      - selected
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: An isolated CLI config has multiple synthetic MCP entries.
        zh: 隔离 CLI 配置有多个合成 MCP 项。
    steps:
      - en: Scan, select one entry, cancel once and then import it.
        zh: 扫描后选一项，先取消再导入。
    expected:
      - en: Cancellation changes nothing and only the selected entry is imported.
        zh: 取消不改变配置，最终只导入选定项。
  - id: capabilities.migrate.config-directory
    title:
      en: Confirm a shared config directory
      zh: 确认共享配置目录
    verifies:
      - directory
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: none
    automation: planned
    preconditions:
      - en: A disposable CLI configuration directory is available.
        zh: 存在可丢弃 CLI 配置目录。
    steps:
      - en: Choose shared mode, cancel then confirm its warning, and inspect a custom-path selection.
        zh: 选择共享模式，先取消再确认警告，并检查自定义路径选择。
    expected:
      - en: Unconfirmed sharing is not applied and the effective selected directory is visible.
        zh: 未确认的共享不生效，实际选定目录可见。
