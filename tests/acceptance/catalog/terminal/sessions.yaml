version: 1
id: terminal.sessions
module: terminal
title:
  en: Keep command sessions controllable
  zh: 让命令会话始终可控制
story:
  en: I can see every running terminal the AI used as a tab, and closing it asks once before it really ends the process.
  zh: 我能把 AI 用过的每个运行终端看作一个标签，关闭时先问一次，然后真正结束进程。
basis: documented
references:
  - src/main/services/ai-terminal/DESIGN.md
  - src/renderer/components/canvas/CanvasCloseGuard.tsx
  - src/renderer/services/ai-work-close.ts
  - src/main/services/ai-terminal/available.ts
  - tests/e2e/specs/acceptance-terminal-sessions.spec.ts
  - tests/e2e/fixtures/acceptance-terminal-sessions.ts
promises:
  lifetime:
    en: Closing the tab of a terminal the AI used asks once; ending it really ends the process, cancelling keeps both.
    zh: 关闭 AI 用过的终端标签先问一次；结束即真正结束进程，取消则两者都保留。
  reachable:
    en: Every live terminal the AI used is a tab of its workspace's canvas, with no separate background list.
    zh: AI 用过的每个活动终端都是所属空间画布的标签，没有单独的后台列表。
  output:
    en: The terminal presents real command output and input reaches the same session.
    zh: 终端显示真实输出，输入送达同一会话。
scenarios:
  - id: terminal.sessions.interact
    title:
      en: Share one terminal with the AI
      zh: 与 AI 使用同一终端
    verifies:
      - output
    platforms:
      - darwin
      - win32
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: &terminal_requirements
      - halo-sdk
      - terminal-shell
    notes: &terminal_evidence
      en: A real UI-created PTY runs a harmless program from the isolated profile using the test runner's absolute Node executable. Actual local scripted terminal tools establish AI contact; no handler or aiTouched state is replaced. Session identity, ordered input receipts, working directory and OS process state are checked. This does not verify a Node executable shipped by Halo. Unknown process state retains the profile instead of being counted as an exit. macOS uses the fixed system Bash; Windows requires its system PowerShell and still needs actual platform execution.
      zh: 真实界面创建的 PTY 使用测试运行器的绝对 Node 路径，运行隔离资料内的无害程序；真实本地脚本模型终端工具建立 AI 接触，不替换处理器或 aiTouched 状态。检查会话身份、有序输入回执、工作目录及操作系统进程状态；不据此验证 Halo 随包 Node。进程状态未知时保留资料，不能计为退出。macOS 使用固定系统 Bash；Windows 要求系统 PowerShell，仍须实际在该平台执行。
    preconditions:
      - en: A local terminal runs a harmless interactive fixture.
        zh: 本地终端运行无害交互测试。
    steps:
      - en: Let the AI read/write it, then type a user response in the canvas.
        zh: 让 AI 读取并写入，再在画布输入用户回答。
    expected:
      - en: Both sides observe the same live session and ordered output.
        zh: 双方观察同一活动会话及有序输出。
  - id: terminal.sessions.keep
    title:
      en: Change my mind about closing a terminal the AI used
      zh: 关闭 AI 用过的终端时改变主意
    verifies:
      - lifetime
      - reachable
    platforms:
      - darwin
      - win32
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: *terminal_requirements
    notes: *terminal_evidence
    preconditions:
      - en: A running terminal has been used by the AI.
        zh: 运行中的终端已被 AI 使用。
    steps:
      - en: Close its tab, read the question and cancel.
        zh: 关闭标签，阅读询问后取消。
    expected:
      - en: The question offers only ending it or cancelling; afterwards the same process runs, its tab is still there and still takes input.
        zh: 询问只提供结束或取消；之后同一进程仍在运行，标签仍在且仍可输入。
  - id: terminal.sessions.terminate
    title:
      en: End a terminal the AI used by closing its tab
      zh: 关闭标签结束 AI 用过的终端
    verifies:
      - lifetime
      - reachable
    platforms:
      - darwin
      - win32
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: *terminal_requirements
    notes:
      en: The target terminal is created through the UI. A separately titled control terminal is created through the real public terminal API as a setup condition; this does not verify a UI naming action. The scripted model reads both actual terminals, which makes both the AI's tabs. The user starts the isolated control program through its visible terminal, closes the target's tab and chooses to end it, then verifies the target's tab is gone and the control's remains. Actual program and shell PID exit, unchanged control identity and keyboard acknowledgements are required. Runner Node is only the harmless fixture executable, not evidence for Halo-shipped commands; unknown exit state retains the profile. macOS uses system Bash and Windows requires actual system PowerShell execution.
      zh: 目标终端通过界面创建；带独立标题的对照终端通过真实公开终端 API 建立前置，不据此声称验证了界面命名。脚本模型实际读取两个终端，使两者都成为 AI 的标签；用户在可见对照终端启动隔离程序，关闭目标标签并选择结束，再确认目标标签消失而对照标签保留。必须验证程序及 shell 的操作系统 PID 已退出、对照身份不变及键盘回执。运行器 Node 仅是无害测试程序执行器，不代表 Halo 随包命令覆盖；退出状态未知时保留资料。macOS 使用系统 Bash，Windows 要求实际系统 PowerShell 执行。
    preconditions:
      - en: A test process runs in a terminal the AI used, beside another one.
        zh: 测试进程在 AI 用过的终端中运行，旁边还有另一个终端。
    steps:
      - en: Close its tab, choose to end it and inspect the processes and the tabs.
        zh: 关闭标签并选择结束，检查进程与标签。
    expected:
      - en: The intended process ends with its tab, and the other terminal and its tab are untouched.
        zh: 指定进程随标签结束，另一个终端及其标签不受影响。
