scope:
  en: Workspace and digital-human memory, settings and consolidation; reserved user-wide memory is not counted as a delivered feature. Guest disclosure policy remains an explicit question.
  zh: 空间与数字人记忆、设置和整理；预留的全用户记忆不计为已交付功能。访客披露策略保留为明确待决事项。
