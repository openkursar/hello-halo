id: memory
title:
  en: Long-term memory
  zh: 长期记忆
description:
  en: Control retained working knowledge and its consolidation.
  zh: 管理保留的工作记忆及整理。
paths:
  - src/main/platform/memory/**
  - src/main/services/memory-consolidation/**
