version: 1
id: chat.execution
module: chat
title:
  en: Stop and recover a reply
  zh: 停止回复并恢复对话
story:
  en: I can stop work and continue afterwards, and failures leave a usable conversation.
  zh: 我能停止工作并继续，失败后对话仍可用。
basis: documented
references:
  - src/main/services/agent/DESIGN.md
  - src/renderer/components/chat/ChatView.tsx
  - tests/e2e/specs/chat.spec.ts
  - tests/e2e/specs/acceptance-chat-recovery.spec.ts
  - tests/e2e/specs/acceptance-context-compaction.spec.ts
promises:
  stop:
    en: Stopping settles the active reply and permits a later turn.
    zh: 停止会结束当前回复状态，并允许下一轮。
  failure:
    en: A failed model request is distinguishable from a completed answer.
    zh: 模型请求失败能与正常完成区分。
  budget:
    en: Context and output limits are presented without inventing a successful result.
    zh: 遇到上下文或输出限制时，不会虚构已成功完成。
  structured-answers:
    en: My single choice, multiple choices or custom answer stays associated with the full question, even when question headings repeat. Submitting resumes work with those answers, and the next question card starts without inherited selections or custom text.
    zh: 单选、多选或自定义回答始终对应问题全文，即使问题标题相同也不混淆。提交后工作携带这些答案继续，下一张提问卡片不继承之前的选择或自定义文本。
  context-continuity:
    en: Ordinary work appends to model history without automatically clearing old tool results or silently trimming conversation records. Near the input limit, summarization makes room before the next work request. If a proactive summary remains unusable after bounded repair, work may continue with the intact history while the estimated request remains below input capacity; a server overflow starts bounded recovery rather than silent trimming.
    zh: 日常工作只追加模型历史，不自动清空旧工具结果或悄悄裁剪对话记录。接近输入上限时先总结腾出空间；主动总结经有界修复仍不可用，但请求估算仍低于输入容量时，可保留完整历史继续工作。服务端超窗触发有界恢复，不悄悄裁剪历史。
  compact-safety:
    en: A summary cannot run tools or replace live context before its checkpoint is saved. Invalid summaries are repaired within a bounded attempt budget without executing tools. Storage failure or exhausted recovery preserves the previous context and reports failure rather than claiming the work finished.
    zh: 总结不能执行工具，也不能在检查点保存之前替换活动上下文。无效总结会在有界次数内修复，期间不执行工具。存储失败或恢复耗尽时保留之前的上下文，并报告失败，而非声称工作完成。
  compact-recovery:
    en: Reducing active context retains the original disk transcript, and a reopened session continues from the saved summary and recent work.
    zh: 缩减活动上下文时保留磁盘上的原始记录，重新打开的会话从已保存的总结及近期工作继续。
  output-allowance:
    en: A large output ceiling does not consume the input working budget. Halo SDK adjusts work output to remaining estimated context without reducing effective thinking; a small work ceiling does not starve internal summaries. A clear output-only parameter-range rejection can lower and retry a request once before content starts, without rewriting saved settings, replaying tools or treating unrelated errors as context overflows.
    zh: 较大的输出上限不会耗尽输入工作预算。Halo SDK 按估算剩余上下文调整工作输出，不降低有效思考；较小工作上限不会饿死内部总结。明确的纯输出参数范围拒绝，可在尚未产生内容时降低额度并重试一次；不改写保存设置、不重放工具，也不将无关错误视为上下文超窗。
scenarios:
  - id: chat.execution.stop-resume
    title:
      en: Stop output and send another message
      zh: 停止输出后再次发送
    verifies:
      - stop
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: A scripted endpoint is streaming a long response.
        zh: 脚本端点正在持续输出。
    steps:
      - en: Click Stop, wait for the settled UI and send a new request.
        zh: 点击停止，等待界面结束运行状态，再发新请求。
    expected:
      - en: The old reply stops and the new turn succeeds without duplicate completion.
        zh: 旧回复停止，新一轮正常完成且不重复结束。
    requirements:
      - halo-sdk
  - id: chat.execution.provider-error
    title:
      en: Recover after provider failure
      zh: 模型服务失败后恢复
    verifies:
      - failure
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    notes:
      en: A deliberate HTTP 401 response verifies visible provider failure and a manual resend after recovery. Automatic retries, every provider error type and reconnecting a changed account remain separate behavior.
      zh: 明确返回 HTTP 401，验证服务错误可见及恢复后的手动重发；不代表已覆盖自动重试、全部错误类型或账号变更重连。
    preconditions:
      - en: A local endpoint rejects the initial turn and is restored before the user resends it.
        zh: 本地模型端点拒绝初次请求，在用户重发前恢复。
    steps:
      - en: Submit a message, inspect the failure, then retry.
        zh: 发送消息，查看错误，再重试。
    expected:
      - en: The failure is visible; the draft/history is recoverable and a successful answer is not duplicated.
        zh: 错误可见；草稿或记录可恢复，成功回复不重复。
  - id: chat.execution.digital-human-provider-error
    title:
      en: See why a digital human's model request was refused
      zh: 看到数字人的模型请求被拒绝的原因
    verifies:
      - failure
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A digital human chats on the Halo SDK engine, and its only model account is a local endpoint that answers every request with HTTP 403 permission_error, as a blocked account is answered, until the endpoint is restored.
        zh: 数字人在 Halo SDK 引擎上聊天，唯一的模型账号是一个本地端点；在恢复之前，它对每个请求都返回 HTTP 403 permission_error，与账号被封时收到的回复相同。
    steps:
      - en: In a new chat with the digital human send a message and wait until the turn has ended; then restore the endpoint and send a follow-up.
        zh: 在与该数字人的新对话中发送一条消息，等待本轮结束；然后恢复端点并发送一条追问。
    expected:
      - en: After the turn has ended the chat still shows the failure with the provider's reason, the record keeps it as the turn's error rather than as an answer, and only one request was made for it; the follow-up gets its answer, the failure stays in the history, and the follow-up's request does not carry the failure text.
        zh: 本轮结束后，对话仍显示失败及服务给出的原因；记录中它是本轮的错误而不是回答，并且只发出了一次请求；追问得到回答，失败仍留在历史中，追问的请求中不带该失败文字。
    notes:
      en: A blocked Claude account (403 "OAuth authentication is currently not allowed for this organization.") left a digital human's chat blank on the Halo SDK engine, while Claude Code showed the reason. The real app runs with only the model endpoint scripted, reached through the app's own model router; the reason text is the one that account received. Claude Code, IM chats, automation runs, team members, errors that are retried and the space conversation (chat.execution.provider-error) are not covered here.
      zh: 一个被封的 Claude 账号（403 "OAuth authentication is currently not allowed for this organization."）在 Halo SDK 引擎下让数字人对话一片空白，而 Claude Code 能显示原因。真实应用运行，仅替换模型端点，并经应用自身的模型路由访问；原因文字取自该账号收到的回复。此处不覆盖 Claude Code、IM 对话、自动化运行、团队成员、会被重试的错误及空间对话（chat.execution.provider-error）。
  - id: chat.execution.structured-answers
    title:
      en: Answer consecutive question cards without mixing decisions
      zh: 连续回答提问卡片而不混淆决定
    verifies:
      - structured-answers
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A space conversation uses the real Halo SDK engine with only its model endpoint scripted. The model asks three distinct full questions with the same heading, covering single choice, multiple choices and a custom answer.
        zh: 空间对话使用真实 Halo SDK 引擎，只替换模型端点。模型以同一标题提出三个全文不同的问题，分别覆盖单选、多选和自定义回答。
    steps:
      - en: Select one option, select two options for the multiple-choice question, and enter text through Other for the custom-answer question; submit the card.
        zh: 单选题选择一个选项，多选题选择两个选项，自定义回答题通过 Other 输入文字，然后提交卡片。
      - en: Inspect the immediately following model request, then answer a second card with new full questions but the same headings, options and question positions, using different answers.
        zh: 检查紧接着的模型请求，再回答第二张卡片；它的问题全文不同，但标题、选项和题目位置相同，改用不同答案。
    expected:
      - en: No continuation request starts before each card is submitted. Each submission produces exactly one next model request whose successful tool result pairs every full question with its submitted answer, with no heading-only keys or answers from another question.
        zh: 每张卡片提交前不发起继续请求。每次提交恰好产生一次下一步模型请求，其中成功的工具结果将每道问题全文与所提交的答案逐一配对，不使用只有标题的键，也不混入其他题的答案。
      - en: The second card initially has no selected options or expanded custom input and cannot be submitted. Opening Other shows an empty input; the next request carries only the second card's new answers for its tool result, and work completes.
        zh: 第二张卡片初始没有已选项或展开的自定义输入，不能提交。打开 Other 后输入框为空；下一请求中该次工具结果只携带第二张卡片的新答案，工作正常完成。
    notes:
      en: One desktop journey covers all three answer forms and repeated headings within and across consecutive cards. It does not establish remote clients, other engines, submission-failure retry or rejected malformed submissions.
      zh: 一个桌面旅程覆盖三种回答方式，以及同卡片和连续卡片之间的重复标题。不代表已验证远程客户端、其他引擎、提交失败重试或畸形提交拒绝。
  - id: chat.execution.limit
    title:
      en: Reach a declared context or turn limit
      zh: 到达明确的上下文或轮次限制
    verifies:
      - budget
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: Use a deterministic response that reports a supported limit outcome.
        zh: 用确定性响应触发受支持的限制结果。
    steps:
      - en: Run until the limit is reached and inspect continuation controls.
        zh: 运行至限制并查看继续操作。
    expected:
      - en: The UI explains the limit and retains previous work for the supported continuation.
        zh: 界面说明限制，并为支持的继续方式保留之前工作。
  - id: chat.execution.cache-wire
    title: Retain reusable context throughout offline scripted work and recovery
    verifies: [context-continuity, compact-safety, compact-recovery, budget]
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      scenario: [append-small, append-200k-large-output, compact-reported, compact-absent, compact-zero, compact-output-only, compact-low-output, compact-thinking-clamped, recovery-empty, recovery-truncated, recovery-tool-use, recovery-retry, recovery-overflow, recovery-checkpoint, recovery-cancel, arrivals, resume, concurrent-isolation, wire-negative-history, wire-negative-marker, summary-merge, fixed-capacity, output-exhausted, child-agent, arrivals-across-compaction, configuration-switch, skill-mcp, breakpoint-envelope]
    preconditions:
      - An isolated public SDK uses its real Anthropic provider against a local scripted HTTP/SSE endpoint. External fetch destinations and redirects are refused.
      - An independent synthetic cache tracks actual serialized request content, breakpoints and expiry; it never assumes the requested hit outcome.
    steps:
      - Run the named scenario through ordinary work, repeated summarization, fault recovery, live input or persisted reopening as applicable.
      - Compare successive wire requests and independently derived simulated cache usage, executed observations, checkpoints and usage totals.
    expected:
      - Ordinary append-only work preserves the previously cached input; after a successful summary the new history becomes reusable without repeated accidental rewrites.
      - Recovery does not execute summary tools, repeat numbered observations, exceed configured output reservations or report successful work after failed checkpoint persistence.
      - Missing usage remains distinct from reported synthetic accounting, and every reported response contributes once.
      - Reopening retains the original transcript and saved handover; concurrent conversations never receive one another's private fixture data.
      - Deliberately corrupting old evidence or removing message breakpoints is detected even when scripted work completes successfully.
    notes: Integration evidence through the built SDK public API and real provider serialization, not Electron E2E. Cache units and capacity counts are synthetic, not vendor tokenization, real cache hits, pricing or summary quality. Large-payload 200K/500K/1M and 300-tool-call stress variants run in the SDK matrix profile separately; a fast pass does not establish those results.
  - id: chat.execution.append-only-context
    title: Keep prior observations intact during ordinary work
    verifies:
      - context-continuity
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      usage: [reported, absent]
    preconditions:
      - A controlled conversation contains several completed tool exchanges whose combined output exceeds the old automatic clearing budget, but its complete request remains below the summary threshold.
    steps:
      - Continue work through another tool call and inspect successive requests at the SDK's public provider boundary.
    expected:
      - Prior messages and tool results remain unchanged and in order; only new work is appended. No summary request or compact boundary is produced.
      - System instructions and tool definitions remain unchanged between these requests.
    notes: Standalone integration with the built SDK and an in-process scripted provider; no application, model service, credentials or network. This verifies request continuity, not measured provider cache hits or latency.
  - id: chat.execution.pre-request-summary
    title: Make room before the next work request without losing the request envelope
    verifies:
      - context-continuity
      - compact-safety
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      usage: [reported, absent]
    preconditions:
      - A complete request is below the summary threshold; its next tool result raises the pending request to at least 90 percent of available input, defined as context window minus reserved output.
      - The scripted provider either reports input and cache usage or omits usage; missing usage is budgeted from the complete local request including system instructions and tools.
    steps:
      - Complete the tool exchange, pause checkpoint persistence, then release it and inspect the next work request.
    expected:
      - Summarization precedes the next work request, using the original system instructions, tools and full conversation with an appended summary instruction.
      - While checkpoint persistence is pending, reduced history is not installed, no compact boundary is emitted, and no next work request starts.
      - After persistence succeeds, the continuation uses the saved candidate with a net reduction in complete-request size and retains recent tool calls and results together. A useful summary is not rejected merely for missing the preferred 55 percent target.
    notes: Integration through public queryLoop, provider and persistence callbacks from the built SDK. The controlled owner writes a checkpoint to an isolated file; actual SDK session persistence and reopening are verified separately. No Electron UI, real tokenizer, cache-hit measurement or live summary quality is established.
  - id: chat.execution.compact-not-installed
    title: Refuse an unsafe or unsaved summary without continuing from it
    verifies:
      - compact-safety
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      failure: [checkpoint-write, summary-tool-call]
    preconditions:
      - Work has reached estimated input capacity after a completed tool exchange, so continuing without successful recovery is not permitted.
    steps:
      - Refuse the asynchronous checkpoint write, or keep returning a tool call through the bounded summary repair.
    expected:
      - The turn reports failure, does not install reduced history or emit a compact boundary, and sends no further work request.
      - Original history is retained and the tool requested by the summary is never executed.
    notes: Standalone built-SDK integration. The checkpoint failure is supplied through the public owner callback, not a real disk-full fault. UI error presentation and storage-device durability are not covered.
  - id: chat.execution.compact-auto-recovery
    title: Recover internal context problems without handing retries to the user
    verifies: [context-continuity, compact-safety, budget]
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      recovery: [transient-summary, invalid-summary, provider-overflow, soft-failure]
    preconditions:
      - An isolated built-SDK conversation reaches proactive context pressure or receives a provider context-overflow response.
      - A scripted provider fails one summary request transiently, returns an invalid summary once, rejects the first post-summary work request as oversized, or repeatedly returns empty summaries while the original request remains below estimated capacity.
    steps:
      - Let the SDK recover and continue the original work without another user message; inspect requests, checkpoint callbacks and final usage.
    expected:
      - The original task completes automatically without executing tools returned by a summary, silently trimming old records, or changing the stable system and tool definitions.
      - Transient retries preserve the summary prefix; invalid output uses a changed handover request; a server overflow can recover immediately after a proactive summary.
      - Repeatedly unusable proactive output below capacity leaves the original history intact and allows ordinary work; no invalid summary is installed.
      - Every reported summary response contributes once to usage, including rejected output; local context estimates never become billed usage.
    notes: Scripted public-SDK integration only; it does not establish live-model summary fidelity, actual provider cache hits, Electron presentation or recovery from a real service outage.
  - id: chat.execution.compact-budget-recovery
    title: Continue through provider budget normalization and oversized summary merges
    verifies: [context-continuity, compact-safety, budget]
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      recovery: [thinking-reservation, merge-reservation, merge-input]
    preconditions:
      - A configured thinking budget can exceed the work output reservation, or ordered summary segments can fit separately while their merge exceeds the provider capacity.
    steps:
      - Run the public SDK with a scripted provider enforcing the relevant request capacity, allowing valid summary responses and final continuation.
    expected:
      - A thinking configuration accepted by ordinary work is not rejected locally before the summary provider can normalize it.
      - An oversized merge recovers within the existing request bound by reducing output reservation or shortening the ordered handovers; no source segment is silently discarded.
      - The original task and latest user constraints remain present, every successful summary response is accounted once and recovery terminates within its bound.
    notes: Built public-SDK integration with scripted responses. Provider wire normalization is additionally covered by SDK serialization tests, not claimed as a live-provider observation here.
  - id: chat.execution.output-allowance
    title:
      en: Continue work with large or small output ceilings and explicit output refusals
      zh: 大小输出上限及明确输出拒绝不妨碍安全继续工作
    verifies: [output-allowance, context-continuity, compact-safety, budget]
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      budget: [large-ceiling, small-work-ceiling, explicit-output-range, unrelated-error, partial-content]
    preconditions:
      - An isolated built-SDK conversation uses a 150000-token working context and a 320000-token output ceiling, a 300-token work ceiling, or a provider that explicitly refuses the output range before any content. Negative variants refuse an unrelated parameter or fail after starting content.
    steps:
      - Run the original task through the public SDK and observe work and summary requests, checkpoints and the unchanged supplied configuration.
    expected:
      - A large ceiling does not trigger unnecessary maintenance on ordinary history; near capacity, bounded summarization precedes continuation with input plus output within the declared working window.
      - A small work ceiling still permits a useful bounded summary, while work requests remain below that ceiling. Effective thinking, system instructions and tool definitions remain unchanged across the summary.
      - Only an explicit output-only range refusal before content permits one corrected request. Unrelated errors and partial-content failures are not replayed. No tool returned by a summary executes, and rejected attempts do not install history or invent usage.
      - Original task constraints survive and the supplied output ceiling remains unchanged.
    notes: Built public-SDK integration with scripted responses; not live-provider limits, summary quality, application settings persistence or measured cache-hit evidence.
  - id: chat.execution.compact-resume
    title: Reopen summarized work while retaining the original transcript
    verifies:
      - compact-recovery
    platforms: *a1
    profiles: [fast, regression]
    evidence: integration
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - An isolated persistent SDK session uses a scripted provider and receives enough ordinary turns to trigger automatic summarization.
    steps:
      - Capture the original transcript bytes, continue until summarization, close and flush the session, then resume it through the public SDK session API.
    expected:
      - Compaction appends to the disk transcript rather than overwriting its original prefix, and the original request and answer remain present.
      - The reopened session supplies the saved summary and new user input to its next work request and completes successfully without summarizing again immediately.
    notes: Real SDK persistence and resume under isolated HOME, USERPROFILE and configuration directories. This is integration evidence, not application reopen, renderer history, crash recovery, collaborator ownership or external Claude Code coverage.
