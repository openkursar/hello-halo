version: 1
id: chat.execution
module: chat
title:
  en: Stop and recover a reply
  zh: 停止回复并恢复对话
story:
  en: I can stop work and continue afterwards, and failures leave a usable conversation.
  zh: 我能停止工作并继续，失败后对话仍可用。
basis: documented
references:
  - src/main/services/agent/DESIGN.md
  - src/renderer/components/chat/ChatView.tsx
  - tests/e2e/specs/chat.spec.ts
  - tests/e2e/specs/acceptance-chat-recovery.spec.ts
promises:
  stop:
    en: Stopping settles the active reply and permits a later turn.
    zh: 停止会结束当前回复状态，并允许下一轮。
  failure:
    en: A failed model request is distinguishable from a completed answer.
    zh: 模型请求失败能与正常完成区分。
  budget:
    en: Context and output limits are presented without inventing a successful result.
    zh: 遇到上下文或输出限制时，不会虚构已成功完成。
scenarios:
  - id: chat.execution.stop-resume
    title:
      en: Stop output and send another message
      zh: 停止输出后再次发送
    verifies:
      - stop
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: A scripted endpoint is streaming a long response.
        zh: 脚本端点正在持续输出。
    steps:
      - en: Click Stop, wait for the settled UI and send a new request.
        zh: 点击停止，等待界面结束运行状态，再发新请求。
    expected:
      - en: The old reply stops and the new turn succeeds without duplicate completion.
        zh: 旧回复停止，新一轮正常完成且不重复结束。
    requirements:
      - halo-sdk
  - id: chat.execution.provider-error
    title:
      en: Recover after provider failure
      zh: 模型服务失败后恢复
    verifies:
      - failure
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    notes:
      en: A deliberate HTTP 401 response verifies visible provider failure and a manual resend after recovery. Automatic retries, every provider error type and reconnecting a changed account remain separate behavior.
      zh: 明确返回 HTTP 401，验证服务错误可见及恢复后的手动重发；不代表已覆盖自动重试、全部错误类型或账号变更重连。
    preconditions:
      - en: A local endpoint rejects the initial turn and is restored before the user resends it.
        zh: 本地模型端点拒绝初次请求，在用户重发前恢复。
    steps:
      - en: Submit a message, inspect the failure, then retry.
        zh: 发送消息，查看错误，再重试。
    expected:
      - en: The failure is visible; the draft/history is recoverable and a successful answer is not duplicated.
        zh: 错误可见；草稿或记录可恢复，成功回复不重复。
  - id: chat.execution.digital-human-provider-error
    title:
      en: See why a digital human's model request was refused
      zh: 看到数字人的模型请求被拒绝的原因
    verifies:
      - failure
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements:
      - halo-sdk
    preconditions:
      - en: A digital human chats on the Halo SDK engine, and its only model account is a local endpoint that answers every request with HTTP 403 permission_error, as a blocked account is answered, until the endpoint is restored.
        zh: 数字人在 Halo SDK 引擎上聊天，唯一的模型账号是一个本地端点；在恢复之前，它对每个请求都返回 HTTP 403 permission_error，与账号被封时收到的回复相同。
    steps:
      - en: In a new chat with the digital human send a message and wait until the turn has ended; then restore the endpoint and send a follow-up.
        zh: 在与该数字人的新对话中发送一条消息，等待本轮结束；然后恢复端点并发送一条追问。
    expected:
      - en: After the turn has ended the chat still shows the failure with the provider's reason, the record keeps it as the turn's error rather than as an answer, and only one request was made for it; the follow-up gets its answer, the failure stays in the history, and the follow-up's request does not carry the failure text.
        zh: 本轮结束后，对话仍显示失败及服务给出的原因；记录中它是本轮的错误而不是回答，并且只发出了一次请求；追问得到回答，失败仍留在历史中，追问的请求中不带该失败文字。
    notes:
      en: A blocked Claude account (403 "OAuth authentication is currently not allowed for this organization.") left a digital human's chat blank on the Halo SDK engine, while Claude Code showed the reason. The real app runs with only the model endpoint scripted, reached through the app's own model router; the reason text is the one that account received. Claude Code, IM chats, automation runs, team members, errors that are retried and the space conversation (chat.execution.provider-error) are not covered here.
      zh: 一个被封的 Claude 账号（403 "OAuth authentication is currently not allowed for this organization."）在 Halo SDK 引擎下让数字人对话一片空白，而 Claude Code 能显示原因。真实应用运行，仅替换模型端点，并经应用自身的模型路由访问；原因文字取自该账号收到的回复。此处不覆盖 Claude Code、IM 对话、自动化运行、团队成员、会被重试的错误及空间对话（chat.execution.provider-error）。
  - id: chat.execution.limit
    title:
      en: Reach a declared context or turn limit
      zh: 到达明确的上下文或轮次限制
    verifies:
      - budget
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: planned
    preconditions:
      - en: Use a deterministic response that reports a supported limit outcome.
        zh: 用确定性响应触发受支持的限制结果。
    steps:
      - en: Run until the limit is reached and inspect continuation controls.
        zh: 运行至限制并查看继续操作。
    expected:
      - en: The UI explains the limit and retains previous work for the supported continuation.
        zh: 界面说明限制，并为支持的继续方式保留之前工作。
