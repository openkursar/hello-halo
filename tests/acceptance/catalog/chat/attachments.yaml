version: 1
id: chat.attachments
module: chat
title:
  en: Give the AI images and files
  zh: 向 AI 提供图片和文件
story:
  en: I can attach relevant material and know what the AI received.
  zh: 我能附上相关材料，并知道 AI 实际收到了什么。
basis: observed
references:
  - src/renderer/components/chat/ImageAttachmentPreview.tsx
  - src/main/services/agent/image-attachments.ts
  - src/main/services/agent/message-utils.ts
  - tests/e2e/specs/acceptance-input.spec.ts
promises:
  image:
    en: Attached images reach a selected vision-capable model and remain part of the conversation; model aliases and routing prefixes do not silently remove supported images.
    zh: 附图会传给所选的视觉模型，并保留在对话记录中；模型别名与路由前缀不会导致支持的图片被静默移除。
  vision-choice:
    en: Known text-only models and explicit user choices to disable Vision do not receive raw image blocks; the application follows its existing non-vision attachment handling rather than silently enabling Vision.
    zh: 已知纯文本模型与用户明确关闭视觉的模型不会收到原始图片块；应用遵守既有非视觉附件处理方式，而非静默开启视觉。
  files:
    en: Attached file references point to the selected file in the working context.
    zh: 文件引用指向工作上下文中选定的文件。
  remove:
    en: Removing a pending attachment prevents it from being sent.
    zh: 发送前移除附件后，该附件不会发送。
  unusable-tool-image:
    en: Reading an empty image reports that no image was attached and leaves the same conversation usable.
    zh: 读取空图片时会说明没有附上图片，并且同一对话可以继续使用。
scenarios:
  - id: chat.attachments.empty-tool-image
    title:
      en: Continue after reading an empty image
      zh: 读取空图片后继续对话
    verifies: [unusable-tool-image]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    preconditions:
      - en: Prepare an empty PNG in an isolated profile and use a local scripted model endpoint.
        zh: 在隔离配置目录中准备空 PNG，并使用本地脚本模型端点。
    steps:
      - en: Ask the AI to read that image, wait for its reply and send another message in the same conversation.
        zh: 让 AI 读取该图片，等待回复后在同一对话继续发送消息。
    expected:
      - en: Read returns an explicit unavailable-image result without raw image data. The reply and follow-up complete, and both user messages and the final answer remain in history.
        zh: Read 明确返回图片不可用且不附上原始图片数据；本轮与后续消息均完成，两条用户消息及最终回复保留在历史中。
    notes:
      en: Covers the application Read path and subsequent conversation. Legacy-history repair and provider image rejection have separate compiled-SDK checks.
      zh: 覆盖应用中的 Read 路径和后续对话；旧历史修复与模型端点拒绝图片另有编译后 SDK 检查。
  - id: chat.attachments.deepseek-flash
    title:
      en: Deliver images through DeepSeek Flash aliases
      zh: 通过 DeepSeek Flash 别名传递图片
    verifies: [image]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      model: [deepseek-flash, deepseek-v4.1-flash, deepseek-v4-flash, deepseek-v4-flash-vision-exp, Pro/deepseek-ai/DeepSeek-V4.1-Flash]
    preconditions:
      - en: An isolated local provider accepts the chosen wire model ID, supplies no vision override and records incoming image content. Prepare a synthetic image with a unique marker.
        zh: 隔离本地服务接受所选传输模型 ID，不提供视觉覆盖值，并记录收到的图片内容；准备带唯一标记的合成图片。
    steps:
      - en: Configure the model through Settings without manually enabling Vision, then attach the image in a conversation and send it.
        zh: 通过设置配置模型，不手动开启视觉，然后在对话中附图发送。
    expected:
      - en: Model Config identifies Vision as enabled, the actual model request contains the image, and saved conversation history retains the attachment with the selected model unchanged.
        zh: 模型配置识别为支持视觉，实际模型请求含图片，保存的对话历史保留附件，所选模型不变。
    notes:
      en: The scripted endpoint proves image transport, not the vendor model's image-understanding quality.
      zh: 脚本端点证明图片传输，不代表厂商模型的图片理解质量。
  - id: chat.attachments.vision-disabled
    title:
      en: Keep raw images away from a text-only or explicitly disabled model
      zh: 不向纯文本或明确关闭视觉的模型发送原图
    verifies: [vision-choice]
    platforms: [darwin, win32, linux]
    profiles: [regression]
    evidence: app-e2e
    mode: scripted
    automation: automated
    requirements: [halo-sdk]
    variants:
      model: [deepseek-chat, deepseek-reasoner, deepseek-v4-pro, deepseek-v4.1-flash]
    preconditions:
      - en: Use an isolated local provider. Leave the legacy text-only models at their defaults; for deepseek-v4.1-flash explicitly disable Vision in Model Config, save and restart. Do not enable OCR or any external service for this case.
        zh: 使用隔离本地服务。纯文本旧型号保持默认；对 deepseek-v4.1-flash 在模型配置中明确关闭视觉，保存并重启。本例不启用 OCR 或任何外部服务。
    steps:
      - en: Open the conversation, inspect its image-input guidance and attempt to supply a synthetic image through the composer.
        zh: 打开对话，检查图片输入提示，并尝试通过输入框提供合成图片。
    expected:
      - en: The application does not present the model as accepting raw images; any model request contains no raw image blocks, and the saved Vision choice is not silently changed.
        zh: 应用不将该模型显示为可接收原图；任何模型请求均不含原始图片块，保存的视觉选择不会被静默更改。
    notes:
      en: This is a negative raw-image transport check. It does not establish OCR extraction or alternative file-reading success.
      zh: 本例仅验证不会传输原图，不证明 OCR 提取或替代文件读取成功。
  - id: chat.attachments.image
    title:
      en: Send an image from the composer
      zh: 从输入框发送图片
    verifies:
      - image
    platforms: &a1
      - darwin
      - win32
      - linux
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: Use a vision-capable model and a synthetic image with a unique marker.
        zh: 使用支持视觉的模型，准备带唯一标记的合成图片。
    steps:
      - en: Attach it in the composer and submit a message.
        zh: 在输入框添加图片并发送。
    expected:
      - en: The model request includes image content and the saved user message retains the attachment.
        zh: 模型请求含图片内容，保存的用户消息保留附件。
    requirements:
      - halo-sdk
  - id: chat.attachments.file
    title:
      en: Ask about a selected local file
      zh: 询问指定本地文件
    verifies:
      - files
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: A workspace file has unique fixture content.
        zh: 空间文件含唯一测试内容。
    steps:
      - en: Attach the file and ask the model to read it.
        zh: 附上文件并让模型读取。
    expected:
      - en: The tool reads that file and the response can be traced to its content.
        zh: 工具读取的是指定文件，回复可对应文件内容。
    requirements:
      - halo-sdk
  - id: chat.attachments.remove
    title:
      en: Remove an attachment before sending
      zh: 发送前移除附件
    verifies:
      - remove
    platforms: *a1
    profiles:
      - regression
    evidence: app-e2e
    mode: scripted
    automation: automated
    preconditions:
      - en: The composer has one attachment and a draft.
        zh: 输入框已有附件和草稿。
    steps:
      - en: Remove the attachment, then submit.
        zh: 移除附件后发送。
    expected:
      - en: The draft sends without that attachment or its content.
        zh: 草稿发送时不包含该附件及内容。
    requirements:
      - halo-sdk
    variants:
      kind:
        - image
        - file
