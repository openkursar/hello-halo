name: SDK worker validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker lifecycle (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- worker tools/mcp tools/bash tools/file-access.test.ts utils/windows-process-tree.test.ts --maxWorkers=2 --minWorkers=1
      - run: node scripts/benchmark-workers.mjs --sessions=10 > worker-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-benchmark-${{ matrix.os }}-${{ matrix.node }}
          path: worker-benchmark.json
          retention-days: 14
