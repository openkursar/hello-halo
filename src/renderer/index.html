<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://hm.baidu.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: halo-file: https:; connect-src *; frame-src 'self' halo-preview:"
    />
  <title>Halo - AI that gets things done</title>
    <style>
      /* Anti-flash: set background before CSS loads */
      html, body, #root { background-color: #181b20; }
      html.light, html.light body, html.light #root { background-color: #ffffff; }

      /* Boot splash: part of the page itself, so the window's first frame
         already shows it while the app's code loads; lib/boot-splash.ts takes
         it down once the first screen has rendered. Colors are the theme
         tokens; the fallbacks are those tokens' values, for dev, where
         globals.css arrives only with the app's code. */
      #boot-splash {
        --boot-background: var(--background, 220 14% 11%);
        --boot-foreground: var(--foreground, 223 17% 92%);
        --boot-muted-foreground: var(--muted-foreground, 217 12% 75%);
        --boot-primary: var(--primary, 217 91% 60%);
        --boot-glow: var(--halo-glow, 217 91% 60%);
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: hsl(var(--boot-background));
        color: hsl(var(--boot-foreground));
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      html.light #boot-splash {
        --boot-background: var(--background, 0 0% 100%);
        --boot-foreground: var(--foreground, 222 16% 11%);
        --boot-muted-foreground: var(--muted-foreground, 218 9% 39%);
        --boot-primary: var(--primary, 217 91% 55%);
        --boot-glow: var(--halo-glow, 217 91% 55%);
      }
      #boot-splash *, #boot-splash *::before, #boot-splash *::after { box-sizing: border-box; }
      .boot-splash-logo { position: relative; width: 96px; height: 96px; }
      .boot-splash-glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-color: hsl(var(--boot-primary) / 0.2);
        filter: blur(24px);
        animation: boot-splash-breathe 3s ease-in-out infinite;
      }
      .boot-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid hsl(var(--boot-primary) / 0.6);
        box-shadow: 0 0 30px hsl(var(--boot-glow) / 0.4);
      }
      .boot-splash-ring-inner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background-image: linear-gradient(to bottom right, hsl(var(--boot-primary) / 0.3), transparent);
      }
      /* Transform/opacity animations only: they keep running while the page's
         main thread is busy loading the app. */
      .boot-splash-arc { position: absolute; inset: 0; animation: boot-splash-spin 2s linear infinite; }
      .boot-splash-arc img { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
      html:not(.light) .boot-splash-arc-light, html.light .boot-splash-arc-dark { display: none; }
      .boot-splash-name {
        margin-top: 32px;
        font-size: 36px;
        line-height: 40px;
        font-weight: 300;
        letter-spacing: 0.05em;
      }
      .boot-splash-tagline {
        margin-top: 12px;
        min-height: 20px;
        font-size: 14px;
        line-height: 20px;
        color: hsl(var(--boot-muted-foreground));
      }
      @keyframes boot-splash-breathe {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes boot-splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-glow, .boot-splash-arc { animation: none; }
      }
    </style>
    <script>
      // Anti-flash: apply theme before render (default: follow OS)
      (function() {
        try {
          // The desktop app passes the theme saved in config (preload); it
          // wins over the localStorage copy, which is brought in line so the
          // app keeps it until config loads (App.tsx). A reload of the same
          // window still gets the theme from when the window was created,
          // while the app has kept localStorage on the live one.
          var navigation = performance.getEntriesByType('navigation')[0];
          var bootTheme = navigation && navigation.type === 'reload' ? null : window.haloBootTheme;
          var theme = bootTheme || localStorage.getItem('halo-theme') || window.haloBootTheme || 'system';
          if (bootTheme) localStorage.setItem('halo-theme', theme);
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'light' || (theme === 'system' && !prefersDark)) {
            document.documentElement.classList.add('light');
          } else if (theme === 'dark' || theme === 'system') {
            document.documentElement.classList.add('theme-dark');
          }
        } catch (e) {}
        // Platform class for conditional CSS (e.g. backdrop-filter only on GPU-enabled platforms)
        if (navigator.userAgent.indexOf('Windows') !== -1) {
          document.documentElement.classList.add('platform-win');
        }
        // Real desktop window (not a browser tab, not the mobile shell) — lets
        // CSS draw window-edge chrome the OS would otherwise own.
        var isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        if (navigator.userAgent.indexOf('Electron') !== -1 && !isNative) {
          document.documentElement.classList.add('platform-desktop');
        }
      })();
    </script>
    <!-- Baidu Tongji Analytics SDK -->
    <script>
      var _hmt = _hmt || [];
      (function() {
        // Skip Baidu Analytics in remote access / Capacitor mode to prevent leaking sensitive info
        // Detection: Electron env has nodeIntegration or preload-injected APIs
        // Capacitor has window.Capacitor; remote browsers have neither
        var isElectron = typeof process !== 'undefined' || navigator.userAgent.includes('Electron');
        var isCapacitor = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        if (!isElectron || isCapacitor) {
          console.log('[Analytics] Non-desktop mode detected, Baidu Analytics disabled');
          return;
        }
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?ba1b0224eb934176ead125ffccc8861b";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-logo">
        <div class="boot-splash-glow"></div>
        <div class="boot-splash-ring">
          <div class="boot-splash-ring-inner"></div>
          <!-- The arc in both themes' primary colors; the theme picks one. -->
          <div class="boot-splash-arc">
            <img class="boot-splash-arc-dark" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%233c83f6' stroke-width='3' stroke-linecap='round' stroke-dasharray='70 200'/%3E%3C/svg%3E">
            <img class="boot-splash-arc-light" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%232474f5' stroke-width='3' stroke-linecap='round' stroke-dasharray='70 200'/%3E%3C/svg%3E">
          </div>
        </div>
      </div>
      <div class="boot-splash-name">Halo</div>
      <div class="boot-splash-tagline" id="boot-splash-tagline"></div>
      <!-- Shows the window with this splash in its first frame: Electron reveals
           it once Chromium counts the page as having content, and any laid-out
           canvas counts at every zoom (the arc image counts only at 100%).
           Without it the window waits for the app's script. Never put it under
           display:none. -->
      <canvas width="0" height="0"></canvas>
    </div>
    <!-- boot-splash-script -->

    <!-- Global Error Fallback: catches fatal errors before React mounts -->
    <div id="global-error-fallback" style="
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      overflow: auto;
    ">
      <div style="max-width: 600px; margin: 0 auto;">
        <div style="
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 2px solid #6366f1;
          opacity: 0.6;
          margin-bottom: 24px;
        "></div>
        <h1 style="font-size: 20px; font-weight: 500; margin: 0 0 8px 0;">
          Halo failed to start
        </h1>
        <p style="color: #a1a1aa; margin: 0 0 24px 0; font-size: 14px;">
          An error occurred before the application could load. Please copy the error below and report it.
        </p>
        <pre id="global-error-message" style="
          background: #18181b;
          border: 1px solid #27272a;
          border-radius: 8px;
          padding: 16px;
          font-family: 'SF Mono', Monaco, Consolas, monospace;
          font-size: 12px;
          line-height: 1.5;
          overflow-x: auto;
          white-space: pre-wrap;
          word-break: break-all;
          color: #f87171;
          margin: 0;
          user-select: text;
        "></pre>
        <p style="color: #71717a; margin: 16px 0 0 0; font-size: 12px;">
          Try restarting the application. If the problem persists, please report at
          <span style="color: #6366f1;">github.com/openkursar/hello-halo/issues</span>
        </p>
      </div>
    </div>

    <script>
      // Global error handler for fatal errors before React mounts
      (function() {
        window.__HALO_APP_MOUNTED__ = false;

        function showFatalError(message) {
          if (window.__HALO_APP_MOUNTED__) return; // React is handling errors

          var fallback = document.getElementById('global-error-fallback');
          var errorMsg = document.getElementById('global-error-message');
          var root = document.getElementById('root');

          if (fallback && errorMsg) {
            root.style.display = 'none';
            var splash = document.getElementById('boot-splash');
            if (splash) splash.remove();
            fallback.style.display = 'block';
            errorMsg.textContent = message;
          }
        }

        window.onerror = function(msg, url, line, col, error) {
          var detail = msg;
          if (url) detail += '\n\nFile: ' + url.split('/').pop() + ':' + line + ':' + col;
          if (error && error.stack) detail += '\n\nStack:\n' + error.stack;
          showFatalError(detail);
          return !window.__HALO_APP_MOUNTED__; // Suppress only if React not mounted
        };

        window.onunhandledrejection = function(event) {
          var reason = event.reason;
          var message = reason instanceof Error
            ? reason.message + (reason.stack ? '\n\nStack:\n' + reason.stack : '')
            : String(reason);
          showFatalError('Unhandled Promise Rejection:\n\n' + message);
        };
      })();
    </script>

    <script type="module" src="./main.tsx"></script>
  </body>
</html>
